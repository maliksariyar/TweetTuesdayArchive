rise","commentary":"","url":"","author":"ShaanVP"},{"text":"- The farmers have a leader And his name is Kevin Van Trump . He\u2019s been writing a farming newsletter called the Van Trump Report for nearly 20 years. He writes it by himself. By hand. Every night. And hasn\u2019t missed a day in 20 years. It\u2019s like ~2 pages of info and 10 pages of memes. I love it, and I\u2019m not even a farmer. There are no ads. He charges a $1,000 per year subscription, and I\u2019m pretty sure he\u2019s making $25-$30M a year off the newsletter. Forget Morning Brew, this guy might be the most...","commentary":"","url":"","author":"ShaanVP"},{"text":"- The industry needed Swag Kevin Van Trump\u2019s son (Jordan) saw a gap in the market to provide high quality swag to agriculture companies. So he created \u201c Ag Swag \u201d. They make hats, shirts, vests, etc.. for huge companies like John Deere. I don\u2019t know the exact numbers, but I\u2019m pretty sure this thing generates tens of millions in revenue, and is profitable. Surprise","commentary":"","url":"","author":"ShaanVP"},{"text":"- Getting out of the bubble helps I spend most of my time in Silicon Valley, surrounded by tech nerds like me. But going to a farming conference in Kansas was a \u201cshake up the snow globe\u201d moment, where I added all kinds of new inputs into my brain. The result was a new business with a farm inspired name ( Milk Road ). It was a newsletter (like the Van Trump Report), but for the crypto industry. Fast forward 1 year - Milk Road was the","commentary":"","url":"","author":"ShaanVP"},{"text":"crypto newsletter in the world, with over 250,000 readers, and we sold the business to a private buyer for millions of dollars. But that\u2019s a story for another day\u2026 I\u2019ll leave you with a few nuggets of Wisdom from Kevin Van Trump: On hiring: Subscribe to keep reading This content is free, but you must be subscribed to read it! Already a subscriber? Sign in . Not now 5 Tweet Tuesday There are 500,000,000 tweets per day. Most suck. So every week I share the 5 best tweets I saw in the past 7 days....","commentary":"","url":"","author":"ShaanVP"}],"num":27},{"title":"\ud83d\udc8e Fast 5 - forgive me father for I have sinned","url":"https://shaan.beehiiv.com/p/fast-5-forgive-father-sinned","date":"2023-06-23","tweets":[{"text":"","commentary":"This facebook Ad from True Classic Tees.<br><br>It\u2019s a great example of \u201cshowing\u201d vs. \u201ctelling.\u201d These guys are crushing right now ($150M in revenue).<br><br>I bet they\u2019ve spent $1m+ on this one ad.","url":"","author":"ShaanVP"},{"text":"","commentary":"This AI deepfake live stream of Trump debating Joe Biden.<br><br>Over 100k+ people have watched the fake debate on Twitch.<br><br>The voices and video are so good, deepfakes are getting really good. warning, NSFW language) #4 I bought this domain (and have no plan for it) I love me a great company name.<br><br>My last company (Milk Road) had a good, simple, easy-to-spell, name.<br><br>I like names that sound familiar, and catchy.<br><br>So I bought this domain yesterday \u201cShoppyJoe\u201d (like the SloppyJoe sandwich).<br><br>I have a long...","url":"","author":"ShaanVP"},{"text":"","commentary":"Nike Marketing Strikes Again Some companies sell shoes.<br><br>Nike sells you becoming the person you want to be. - shaan P.S.<br><br>Have a great day, you deserve it","url":"","author":"ShaanVP"}],"num":26},{"title":"5 Tweet Tuesday - June 20, 2023","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-june-20-2023","date":"2023-06-20","tweets":[{"text":"And everyone in Silicon Valley over 40","commentary":"I\u2019m a sucker for print ads like this.<br><br>I have no idea if brand ads like this work, but I love them like they\u2019re some weird version of marketing art.","url":"https://twitter.com/Jason/status/1670846160431644672","author":"Jason"},{"text":"7/ (h/t to @eshear for this one) Startups are not a thinking game, they are a doing game. If you don&#x27;t have good startup ideas now, the way to get better ones isn&#x27;t to think really hard - it&#x27;s to build stuff and launch it and learn from what happens.","commentary":"I\u2019ll take it further.<br><br>LIFE is a doing game.<br><br>Here\u2019s a little trick to do this: Try to &quot;create&quot; more than you &quot;consume&quot;.<br><br>It&#x27;s really easy to get stuck just scrolling TikTok or bingeing Netflix.<br><br>The world is made up of two people: Creators &amp; Consumers.<br><br>Be more of a creator.","url":"https://twitter.com/snowmaker/status/1670557767105675264","author":"snowmaker"},{"text":"A hallmark of successful startups: each board meeting brings fresh challenges. A hallmark of unsuccessful startups: we keep discussing the same things.","commentary":"Agreed.<br><br>You can see this with friends too.<br><br>The friend who keeps complaining about the same things over and over again becomes the energy drain of your friend group.","url":"https://twitter.com/DavidSacks/status/1656807906002759681","author":"DavidSacks"},{"text":"Silver bullet question: Asking a successful or failed founder in a given area: \u201cwhat would you do if you had to start another startup in this area?\u201d There\u2019s more I could mention but these are the big highlights","commentary":"Love this.<br><br>Stealing for my \u201chall of fame questions\u201d file","url":"https://twitter.com/jacobrintamaki/status/1670253773665763329","author":"jacobrintamaki"},{"text":"","commentary":"\ud83e\udd23\ud83e\udd23\ud83e\udd23 \ud83e\udd23\ud83e\udd23 P.S.<br><br>Which tweet was gold for you?<br><br>Reply with the number (#1, #2, #3, #4, or #5)!","url":"","author":"ShaanVP"}],"num":25},{"title":"5 Tweet Tuesday - June 13, 2023","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-87e9","date":"2023-06-13","tweets":[{"text":"The most effective networking strategy I\u2019ve found has nothing to do with conferences, cocktail hours, cold emails, or any of the common ideas you hear. 1) Do interesting things. 2) Share them publicly. Like-minded people will come to you.","commentary":"I couldn\u2019t agree more.<br><br>All the content I create (podcast, twitter, or this email) is just creating a giant magnet to attract like-minded people.<br><br>Way easier to let them come to you vs. going to events and trying to shake hands with strangers.","url":"https://twitter.com/JamesClear/status/1666444905303126016","author":"JamesClear"},{"text":"","commentary":"Some great things take time even the great ones don&#x27;t nail it on the first try.<br><br>Airbnb launched 4 times in 2 years before it took off! #2.5 \ud83d\udc8e I found a cheat code I finally feel like I cracked a life cheat code by hiring a remote personal assistant.<br><br>I broke it all down here + you can grab my system and get a $500 credit to use with Shepherd (aka you\u2019re getting 2x cash back).<br><br>Check it out here and thank me later!","url":"","author":"ShaanVP"},{"text":"Cardone is the presenting sponsor for pro slapping. The guy is a genius at reaching his target audience","commentary":"honestly a little jealous i didn&#x27;t think of this no small boy stuff\u2026..<br><br>SLAP .","url":"https://twitter.com/jchal/status/1667730517439987712","author":"jchal"},{"text":"When Steve Jobs set goals, he kept them shockingly simple and didn&#x27;t include any metrics or benchmarks. Are specific, measurable goals a waste of time?","commentary":"pretty cool to see how Steve Jobs graded Apple&#x27;s annual performance. simple, honest grades","url":"https://twitter.com/BenWilsonTweets/status/1666819787195027457","author":"BenWilsonTweets"},{"text":"pic.twitter.com/xHJFjesPQa","commentary":"\ud83e\udd23 P.S.<br><br>Which tweet was gold for you?<br><br>Reply with the number (#1, #2, #3, #4, or #5)! 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I share the 5 best tweets I saw in the past 7 days.<br><br>Home Posts Authors \u00a9 2 have learned a bunch of lessons If you\u2019re showering on camera during the webinar, I will kick you out!<br><br>If you\u2019re a CEO/exec, you should join the webinar.<br><br>It\u2019s free.<br><br>We hit 5,000 sign...","url":"https://twitter.com/fiholicMD/status/1666067254352691202","author":"fiholicMD"},{"text":"The Apple Vision Pro uses cutting edge technology to show a passthrough view of your eyes, a feature they call EyeSight.\u00a0\u00a0You can accomplish 50% of the realism for 0.1% of the cost using this vinyl sticker:","commentary":"I\u2019m guessing you\u2019ve heard about it, but Apple announced their new $3,500 headset on Monday.<br><br>I watched the full announcement yesterday and I thought there was one possible breakout use case - watching movies and tv shows.<br><br>I\u2019m not overly excited by it tbh, but I\u2019m 100% buying one when it comes out.<br><br>Here\u2019s the thing: Facebook has reportedly sold over 20m headsets\u2026Apple will definitely sell atleast 1m of these out of the gates.<br><br>That\u2019s $3.5B dollars.<br><br>Billion with a B.<br><br>Google glass neither succeeded...","url":"https://twitter.com/PalmerLuckey/status/1665905018275495937","author":"PalmerLuckey"},{"text":"","commentary":"LOL, it\u2019s tax season again \ud83e\udd23 P.S.<br><br>Which tweet was gold for you?<br><br>Reply with the number (#1, #2, #3, #4, or #5)! 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I share the 5 best tweets I saw in the past 7 days.<br><br>Home Posts Authors \u00a9 2026 Shaan Puri.<br><br>Privacy policy Terms of use Powered by beehiiv","url":"","author":"ShaanVP"}],"num":23},{"title":"5 Tweet Tuesday","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-d413","date":"2023-05-30","tweets":[{"text":"","commentary":"Zuck is a Monster Doing a \u201cMurph\u201d (Run 1 mile, 100 pull-ups, 200 pushups, 300 squats, Run another mile) in 39 minutes is insane .<br><br>Zuck is doing the ultimate revenge on the nerds.<br><br>He got richer than the rich kids at Harvard.<br><br>More powerful than the politicians.<br><br>And stronger than the jocks.<br><br>I\u2019m going to go buy a plain grey t-shirt and 100 shares of $META stock in his honor today.","url":"","author":"ShaanVP"},{"text":"When young founders build something that they don&#x27;t want themselves but that they believe some group of other people want, 90% of the time they&#x27;re building something no one wants.","commentary":"I\u2019m guilty of this startup sin.<br><br>It\u2019s so much easier to make something where you\u2019re the customer.<br><br>Another sneaky useful question I use: \u201cWould I want to hang out with the customer of this product?\u201d - I prefer to build companies where I enjoy the customer base.","url":"https://twitter.com/paulg/status/1662483849203314695","author":"paulg"},{"text":"If you\u2019ve ever hosted a \u201cwebinar\u201d, your spouse is having an affair.","commentary":"\u2026and let\u2019s take this opportunity to tell you I\u2019m hosting a webinar with my boy Nick Huber ( @sweatystartup ) where we show you how we hire &amp; train employees in the Philippines.<br><br>I hire ~80% of my team in the Philippines / South America This saves me a ton of money (they\u2019re 10x cheaper than Americans) And over the past 10 years have learned a bunch of lessons If you\u2019re a CEO/exec, you should join the webinar.<br><br>It\u2019s free.<br><br>We hit 1,900 signups so far and even if you can\u2019t make it live, if you sign...","url":"https://twitter.com/nikitabier/status/1662198431962783745","author":"nikitabier"},{"text":"the next zuckerberg is up all night, coding up an AI girlfriend/boyfriend. Steve Jobs fixed boredom (phone) Zuck fixed people watching (FB/IG) Speigel fixed flirting (Snap) The next one will fix loneliness. people will mock it, use it, then be addicted to it.","commentary":"A simple formula for a viral tweet: Piss off 70% of readers (\u201cThey didn\u2019t FIX this, they BROKE EVERYTHING!\u201d) Confirm beliefs for 30% of readers (\u201cagreed.<br><br>AI is gonna change everything\u201d) End it with a catchy, fortune cookie style piece of wisdom (\u201cpeople will mock it, use it, then be addicted to it.\u201d)","url":"https://twitter.com/ShaanVP/status/1661884084824719362","author":"ShaanVP"},{"text":"What does the washing machine gain by lying about how long the cycle has left, if u need more time just say it?","commentary":"\ud83e\udd23 At least we know why Uber and Doordash lie about their wait times P.S.<br><br>Which tweet was gold for you?<br><br>Reply with the number (#1, #2, #3, #4, or #5)! 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I share the 5 best tweets I saw in the past 7 days.<br><br>Home Posts Authors \u00a9 2026 Shaan Puri.<br><br>Privacy policy Terms of use Powered by beehiiv","url":"https://twitter.com/LEMONBALMBABY/status/1410713459008888836","author":"LEMONBALMBABY"}],"num":22},{"title":"5 Tweet Tuesday","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-b79e","date":"2023-05-24","tweets":[{"text":"Companies are built on Sundays. Plan on Sunday. Execute the plan Monday thru Thursday. Clean up Friday. Rest on Saturday.","commentary":"Totally agree.<br><br>I find that 2 hours of thinking/planning on Sunday can save me 10 hours during the week","url":"https://twitter.com/aymanalabdul/status/1660348537056423936","author":"aymanalabdul"},{"text":"@ESYudkowsky A nontrivial part of the value of YC is that we give people a high-status brand under which to do low-status things. Being able to tell your parents &quot;I got funded by YC&quot; gives you cover to do things that don&#x27;t scale.","commentary":"So true.<br><br>A few other examples of high-status brands that let you do low-status things: Military training (crawl through mud, carry shit) Universities (4 year excuse to chill/party) Crossfit","url":"https://twitter.com/paulg/status/1659510108500500480" ing, hiring, etc.)","url":"https://twitter.com/jackbutcher/status/1594321981260075008","author":"jackbutcher"},{"text":"wakeup from your Eight Sleep to My First Million, readjust your Oura Ring, take a shot of Athletic Greens on the way to Equinox, then head to work on your Generative AI or B2B SaaS startup, while refreshing Elon\u2019s latest tweets. you\u2019re now assimilated to SF.","commentary":"I\u2019m only sharing this tweet because she mentioned my podcast as the \u2018basic\u2019/\u2019cliche\u2019 thing to listen to.<br><br>That\u2019s when you know you\u2019ve made it. #3.5 \ud83d\udc8e Sponsor S/O: Monthly 1k Want a step-by-step guide to launching your own business in under a month?<br><br>Monthly 1K is Noah Kagan\u2019s course that teaches you actionable techniques to take you from ideation to successful business.<br><br>Right now it\u2019s just $600 $1 for AppSumo\u2019s crazy Black Friday specials ( check it out here ).","url":"https://twitter.com/jaiyagill/status/1592700499890872321","author":"jaiyagill"},{"text":"What are your all-time favorite products? I\u2019ll go first: The @McDonalds hash brown","commentary":"Mine: Jamby&#x27;s Lounge Wear .<br><br>They aren\u2019t sponsoring me.<br><br>I just love them and wear it everyday.<br><br>Boxers with pockets..hot damn! that\u2019s what I call innovation!","url":"https://twitter.com/brextonpham/status/1594210155381796864","author":"brextonpham"},{"text":"Never met a 34 year old Cody. Working on a theory that every Cody gets executed after 7th grade","commentary":"\ud83e\udd23 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I share the 5 best tweets I saw in the past 7 days.<br><br>Home Posts Authors \u00a9 2026 Shaan Puri.<br><br>Privacy policy Terms of use Powered by beehiiv","url":"https://twitter.com/stavvybaby/status/1593321465260216322","author":"stavvybaby"}],"num":4},{"title":"5 Tweet Tuesday - November 15th","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-november-15th","date":"2022-11-15","tweets":[{"text":"What is retirement? \u201cWhen you stop sacrificing today for tomorrow. When today is complete, in and of itself, you\u2019re retired\u201d - @naval","commentary":"This hit home for me.<br><br>It\u2019s not even just a formula for retirement, it\u2019s a formula for happiness, joy, peace, etc.","url":"https://twitter.com/shaanvp/status/1592627378790236160","author":"shaanvp"},{"text":"pic.twitter.com/F90Kx0eVwK","commentary":"Pick the right line.","url":"https://twitter.com/john/status/1583522284836265984","author":"john"},{"text":"I&#x27;ve said this before, but it&#x27;s worth repeating: When I started in 2012, I thought I was too late. It seemed like blogs and newsletters had already peaked. It\u2019s not too late. Someone is starting the next 1M person email list right now. If you&#x27;re thinking about starting, do it.","commentary":"Don&#x27;t overthink it.<br><br>Just start! #3.5 \ud83d\udc8e\u00a0\u00a0Sponsor S/O: Hire with Near Near is an easy way for companies to hire awesome talent in LatAm.<br><br>English-speaking talent, in your time zone, and 30-70% less than US market White-glove, full-service.<br><br>You\u2019ll hire top talent in 3 weeks.<br><br>Customer success stories: 100-person marketing firm hired 10% of their headcount with Near $100mm software firm scaled their accounting and finance departments with Near @RohunJauhar and @girdley hired VAs in under 3 weeks Join...","url":"https://twitter.com/JamesClear/status/1584959272991223809","author":"JamesClear"},{"text":"The most important mindset shift as CEO is from hiring generalists to specialists. You hire generalists to create something from scratch, and specialists to scale and grow.","commentary":"The opposite is true too.<br><br>If you see a startup hiring specialists very early on - it&#x27;s typically a mistake.","url":"https://twitter.com/austin_rief/status/1574030102748430342","author":"austin_rief"},{"text":"When you&#x27;r ) almost died overnight 2/ And why this is a god tier strategic move by @cz_binance","commentary":"Your boy went viral this morning writing.<br><br>This thread has reached1M+ people, explaining what\u2019s going on with the big crypto drama (FTX imploding and getting bought by Binance)","url":"https://twitter.com/ShaanVP/status/1590029012000440320","author":"ShaanVP"},{"text":"But think about how many it produces","commentary":"\ud83e\udd23 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I share the 5 best tweets I saw in the past 7 days.<br><br>Home Posts Authors \u00a9 2026 Shaan Puri.<br><br>Privacy policy Terms of use Powered by beehiiv","url":"https://twitter.com/marknorm/status/1589780135007617024","author":"marknorm"}],"num":2},{"title":"5 Tweet Tuesdays - October 27th","url":"https://shaan.beehiiv.com/p/5-tweet-tuesdays-october-27th","date":"2022-10-25","tweets":[{"text":"It\u2019s remarkable how people like @joerogan and @lexfridman are building absolute media empires by simply listening to people for once instead of cutting them off and consistently trying to shape a cohesive narrative","commentary":"The two types of content I think are just going to get more and more popular: high fructose corn syrup - eg tiktok.<br><br>Short form, instant hit of entertainment in 10 second bursts\u200b organic - eg 1-2 hour podcasts where it\u2019s just a couple of people genuinely talking and not a forced \u201ctalk show\u201d with fake knee slapping laughs (eg joe Rogan, not jimmy fallon)","url":"https://twitter.com/Austen/status/1584712364091265025","author":"Austen"},{"text":"Comedians are the best thought leaders because they understand how the world works but they want to make you laugh rather than making themselves feel smart.","commentary":"This is why I respect comedians so much.","url":"https://twitter.com/morganhousel/status/1448273940007116803","author":"morganhousel"},{"text":"Prada Temperature Reactive Puffer (2022)","commentary":"I love products that have a \u201cparty trick\u201d.<br><br>Where you can say \u201ccheck this out\u201d Eg those book cases where you pull a book and it opens a secret door.","url":"https://twitter.com/StreetFashion01/status/1583391943924801537","author":"StreetFashion01"},{"text":"Always beware a Mormon salesman. If they can sell religion, imagine everything else to follow. They are a gritty people in some ways, able to go to foreign lands, learn the language, and infiltrate the minds of others on a product that is inherently difficult to sell.","commentary":"\ud83e\udd23\ud83e\udd23\ud83e\udd23 this is why I invest in Mormons.<br><br>If you are willing to move to a foreign country for a 2 year unpaid mission, not talk to family or friends, and spend everyday doing door to door religion sales\u2026.<br><br>You will have no problem doing a startup.","url":"https://twitter.com/datarade/status/1582970145085214720","author":"datarade"},{"text":"girls be like \u201ctime to relax\u201d then hop on netflix to watch serial kiIIer documentaries","commentary":"\ud83e\udd23 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I share the 5 best tweets I saw in the past 7 days.<br><br>Home Posts Authors \u00a9 2026 Shaan Puri.<br><br>Privacy policy Terms of use Powered by beehiiv","url":"https://twitter.com/ayeejuju/status/1574619479392235520","author":"ayeejuju"}],"num":1}];

const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(d){if(!d)return'Undated';const[y,m,day]=d.split('-');return MO[+m-1]+' '+parseInt(day)+', '+y}
function showToast(msg){const t=document.getElementById('toastEl');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function gLS(k,d){try{return JSON.parse(localStorage.getItem('5tt_'+k))||d}catch(e){return d}}
function sLS(k,v){try{localStorage.setItem('5tt_'+k,JSON.stringify(v))}catch(e){}}

let pins=gLS('pins',[]),readE=gLS('read',{}),activeY=null,activeA=null,query='';

// Theme
function toggleTheme(){
  const isLight=document.body.classList.toggle('light');
  sLS('theme',isLight?'light':'dark');
  document.getElementById('themeBtn').innerHTML=isLight?'&#9728;':'&#9790;';
}
(function(){const t=gLS('theme','dark');if(t==='light'){document.body.classList.add('light');document.getElementById('themeBtn').innerHTML='&#9728;'}})()

// Stats
document.getElementById('sE').textContent=D.length;
document.getElementById('sT').textContent=D.reduce((s,e)=>s+e.tweets.length,0);
const allA=new Set(D.flatMap(e=>e.tweets.map(t=>t.author.toLowerCase())));
document.getElementById('sA').textContent=allA.size;

// Index
const idx=D.map((e,i)=>({...e,_idx:i,_s:(e.title+' '+e.date+' '+e.tweets.map(t=>t.author+' '+t.text+' '+(t.commentary||'')).join(' ')).toLowerCase()}));

// Years
const yrs=[...new Set(D.filter(e=>e.date).map(e=>e.date.slice(0,4)))].sort().reverse();
const yf=document.getElementById('yf');
function mkY(l,yr){const b=document.createElement('button');b.className='ybtn'+(yr===null?' on':'');b.textContent=l;b.onclick=()=>{activeY=yr;document.querySelectorAll('.ybtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()};yf.appendChild(b)}
mkY('all',null);yrs.forEach(y=>mkY(y,y));

// Authors
const aC={};
D.forEach(e=>e.tweets.forEach(t=>{const a=t.author.toLowerCase();if(a&&a!=='shaanvp')aC[a]=(aC[a]||0)+1}));
const topA=Object.entries(aC).sort((a,b)=>b[1]-a[1]).slice(0,30);
const aG=document.getElementById('aG');
topA.forEach(([author,count])=>{
  const b=document.createElement('button');b.className='abtn';
  b.innerHTML='@'+author+'<span class="ac">'+count+'</span>';
  b.onclick=()=>{if(activeA===author){activeA=null;b.classList.remove('on')}else{document.querySelectorAll('.abtn').forEach(x=>x.classList.remove('on'));activeA=author;b.classList.add('on')}render()};
  aG.appendChild(b);
});

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render()});

// Pin helpers
function pinKey(t){return(t.url||'')+'|'+t.author+'|'+(t.text||t.commentary||'').slice(0,40)}
function isPinned(t){return pins.some(p=>p.key===pinKey(t))}

function doPin(eidx,tidx){
  const e=D[eidx],t=e.tweets[tidx],key=pinKey(t);
  const i=pins.findIndex(p=>p.key===key);
  if(i>=0){pins.splice(i,1);showToast('unpinned')}
  else{pins.push({key,text:t.text||t.commentary||'',author:t.author,url:t.url||'',date:e.date,isComm:!t.text,enum:e.num});showToast('pinned \u2733')}
  sLS('pins',pins);renderPins();render();
}

function rmPin(key){
  pins=pins.filter(p=>p.key!==key);sLS('pins',pins);renderPins();render();showToast('unpinned');
}

function renderPins(){
  const sec=document.getElementById('pS'),body=document.getElementById('pB');
  document.getElementById('pC').textContent=pins.length;
  if(!pins.length){sec.classList.remove('has-pins','open');return}
  sec.classList.add('has-pins','open');
  body.innerHTML=pins.map((p,i)=>'<div class="pinned-tweet" data-goto="'+(p.enum||'')+'" style="cursor:pointer"><button class="unpin" data-pidx="'+i+'">&#10005;</button><div class="ttext">'+p.text+'</div><div class="tmeta"><span class="tauthor">@'+p.author+'</span><span style="font-size:10px;color:var(--t3);font-family:DM Mono,monospace">'+(p.date?fmt(p.date):'')+'</span></div></div>').join('');
}

function goToEdition(num){
  const ed=document.querySelector('.edition[data-n="'+num+'"]');
  if(!ed)return;
  if(!ed.classList.contains('open'))ed.classList.add('open');
  setTimeout(()=>ed.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

// Progress
function markRead(n){readE[n]=true;sLS('read',readE);updProg()}
function updProg(){const r=Object.keys(readE).length,p=Math.round(r/D.length*100);document.getElementById('pPct').textContent=p+'%';document.getElementById('pFill').style.width=p+'%'}

// Surprise
function surprise(){
  activeY=null;activeA=null;query='';document.getElementById('q').value='';
  document.querySelectorAll('.ybtn').forEach(b=>b.classList.toggle('on',!b.dataset.year));
  document.querySelectorAll('.abtn').forEach(b=>b.classList.remove('on'));
  render();
  const eds=document.querySelectorAll('.edition');if(!eds.length)return;
  const r=eds[Math.floor(Math.random()*eds.length)];
  eds.forEach(e=>e.classList.remove('open'));r.classList.add('open');
  setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'center'}),100);
}

// Event delegation for actions
document.addEventListener('click',function(ev){
  const readBtn=ev.target.closest('[data-action="read"]');
  if(readBtn){ev.preventDefault();ev.stopPropagation();const n=readBtn.dataset.rn;if(readE[n]){delete readE[n];readBtn.classList.remove('is-read');readBtn.closest('.edition').classList.remove('read-mark');showToast('unmarked')}else{readE[n]=true;readBtn.classList.add('is-read');readBtn.closest('.edition').classList.add('read-mark');showToast('marked as read')}sLS('read',readE);updProg();return}
  const pinBtn=ev.target.closest('[data-action="pin"]');
  if(pinBtn){ev.preventDefault();ev.stopPropagation();const tw=pinBtn.closest('.tweet'),ed=tw.closest('.edition');doPin(+ed.dataset.eidx,+tw.dataset.tidx);return}
  const unpinBtn=ev.target.closest('.unpin');
  if(unpinBtn){ev.stopPropagation();const i=+unpinBtn.dataset.pidx;if(pins[i])rmPin(pins[i].key);return}
  const pinnedTweet=ev.target.closest('.pinned-tweet[data-goto]');
  if(pinnedTweet){const num=pinnedTweet.dataset.goto;if(num)goToEdition(num);return}
});

// Render
const chevSVG='<svg class="echev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';

function render(){
  let items=idx;
  if(activeY)items=items.filter(e=>e.date&&e.date.startsWith(activeY));
  if(activeA)items=items.filter(e=>e.tweets.some(t=>t.author.toLowerCase()===activeA));
  if(query)items=items.filter(e=>e._s.includes(query));
  const feed=document.getElementById('feed'),empty=document.getElementById('empty');
  if(!items.length){feed.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  const ao=!!(query||activeA);
  feed.innerHTML=items.map(e=>{
    const ir=readE[e.num];
    return '<div class="edition'+(ao?' open':'')+(ir?' read-mark':'')+'" data-n="'+e.num+'" data-eidx="'+e._idx+'">'+
    '<div class="ehdr" onclick="togE(this)"><span class="edot"></span><span class="enum">#'+e.num+'</span><span class="edate">'+fmt(e.date)+'</span><button class="echeck'+(ir?' is-read':'')+'" data-action="read" data-rn="'+e.num+'" title="Mark as read">&#10003;</button>'+chevSVG+'</div>'+
    '<div class="ebody">'+
    e.tweets.map((t,i)=>{
      const ip=isPinned(t),hl=activeA&&t.author.toLowerCase()===activeA;
      let card='<div class="tweet'+(hl?' highlight':'')+'" data-tidx="'+i+'">';
      if(t.text){
        card+=t.url?'<a class="tweet-top" href="'+t.url+'" target="_blank" rel="noopener">':'<div class="tweet-top">';
        card+='<div class="ttext">'+t.text+'</div><div class="tmeta"><span class="tauthor">@'+t.author+'</span><div class="tweet-actions"><button class="tact'+(ip?' pinned-state':'')+'" data-action="pin" title="Pin">&#9733;</button></div></div>';
        card+=t.url?'</a>':'</div>';
      }
      if(t.commentary){
        if(t.text)card+='<div class="tsep"></div>';
        card+='<a class="tweet-bottom" href="'+e.url+'" target="_blank" rel="noopener"><div class="tcomm-tag">shaan:</div><div class="tcomm">'+t.commentary+'</div></a>';
      }
      if(!t.text&&!t.commentary&&t.url){
        card+='<a class="tweet-top" href="'+t.url+'" target="_blank" rel="noopener"><div class="tmeta"><span class="tauthor">@'+t.author+'</span></div></a>';
      }
      card+='</div>';
      return card;
    }).join('')+
    '<a class="efull" href="'+e.url+'" target="_blank" rel="noopener">read full newsletter &#8599;</a>'+
    '</div></div>';
  }).join('');
}

function togE(h){h.parentElement.classList.toggle('open')}

render();renderPins();updProg();
window.addEventListener('scroll',()=>{document.getElementById('topBtn').style.display=window.scrollY>600?'flex':'none'});
</script>
