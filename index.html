e things\u201d. I\u2019ll say it again, louder for the people in the back:\u00a0 THERE ARE NO BIG SURE THINGS in business. All big things have tons of grey, unknowns. The odds of success seem slim. Nearly every great business pivots at some point. Slack was a video game. Twitter was a podcasting app. Rarely do you just have an idea and, \u201cbam, we nailed it, first try. Let\u2019s go pop champagne fellas\u201d You need a cofounder who won\u2019t flinch at...","commentary":"","url":"","author":"ShaanVP"},{"text":"- Picky Eaters Make For Bad Partners. Can you share weird, half baked ideas with your partner? We all have that friend who\u2019s very religious and conservative. You have to pre-filter your words around them. When your partner isn\u2019t down, there\u2019s a tendency to filter your ideas. You soften all the hard edges, rinse off the weirdness to make it more socially acceptable. Picky eaters force you to water down your dish. This is a major problem - because when you\u2019re doing something new - weirdness is...","commentary":"","url":"","author":"ShaanVP"}],"num":81},{"title":"5 Tweet Tuesday - September 3, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-september-3-2024","date":"2024-09-03","tweets":[{"text":"&quot;When I was a boy, there was a popular saying: Don\u2019t just sit there; do something. But for investing, I\u2019d invert it: Don\u2019t just do something; sit there. Develop the mindset that you don\u2019t make money on what you buy and sell; you make money on what you hold.&quot;","commentary":"Imagine a 300 lb football player trying to do Simone Biles&#x27; balance beam routine\u2026 That\u2019s what it\u2019s like when a founder tries to switch gears and become a great investor.<br><br>The things that helped you in one game (high action bias) can badly hurt you in another.<br><br>I love the Charlie Munger quote about investing: \u201cThe big money isn\u2019t in the buying and selling, it\u2019s in the waiting.\u201d","url":"https://twitter.com/InvestingCanons/status/1829217836671066524","author":"InvestingCanons"},{"text":"\ud83c\udf43 Eat clean -&gt; \ud83d\ude0a depression stops What is clean? Anything that comes from the farm or nature like fresh meat, vegetables, fruit, rice, potatoes etc. What is not clean? Anything produced in a factory","commentary":"Hey it\u2019s the 5 tweet Tuesday value meal. 2-For-1.<br><br>The idea that our standard diet is poison (not just for our body but for our mind) is a big topic that\u2019s going to become very popular soon.","url":"https://twitter.com/levelsio/status/1829904051196326283","author":"levelsio"},{"text":"jack dorsey ( @jack ) is forever goated to run twitter (and square) thru just his notes app.","commentary":"I thought this was fake when I first saw it.<br><br>Jack Dorsey was running 2 billion-dollar companies using just his iPhone notes app?<br><br>Turns out, it\u2019s true.<br><br>He had a separate note for all the important people in the company (i.e. his CFO, Sarah Friar, had her own note.<br><br>Whenever Jack had a question, he\u2019d drop it there) He had a note for everything he was doing on a daily basis, and things he didn\u2019t want to do (he called this his \u201cdon\u2019t list\u201d) P.S. - he walked through his process in this Y Combinator...","url":"https://twitter.com/gaxrav/status/1829373047972700584","author":"gaxrav"},{"text":"I think about decisions in three ways: hats, haircuts, and tattoos.","commentary":"Great framing \u2013 decisions are like hats, haircuts, and tattoos.","url":"https://twitter.com/liminal1988/status/1830234952409170338","author":"liminal1988"},{"text":"\u201cIf you had invested in Apple in 2007\u2026\u201d Me in 07:","commentary":"if you know, you know \ud83d\ude02 PS: I dropped a huge one\u2026 Did you read the 2-part essay I posted last week?<br><br>They were the highest rated essays I\u2019ve ever written.<br><br>Check em out here: Strategically Broke - How I spent a year \u201cstrategically broke\u201d (w/ pics &amp; $$) Permission to Wander - The 3-step plan to figure out what you want to do in life What\u2019d you think of today\u2019s edition?<br><br>Hit \u2018reply\u2019 to this email and lemme hear it! 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I...","url":"https://twitter.com/SherzyOne/status/1827739529404453157","author":"SherzyOne"}],"num":80},{"title":"5 Tweet Tuesday - August 27, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-august-27-2024","date":"2024-08-27","tweets":[{"text":"&quot;If you are patient in one moment of anger, you will avoid one hundred days of sorrow.&quot; \u2014 Chinese Proverb","commentary":"Very true.<br><br>I need this reminder in all my fortune cookies.","url":"https://twitter.com/ryanholiday/status/1828175588412268960","author":"ryanholiday"},{"text":"Warren Buffett (in 1994) on ignoring political and economic distractions.","commentary":"Warren Buffett during the 1994 presidential election (Bill Clinton won): \u201cWe will continue to ignore political and economic forecasts which are a distraction to investors and businessmen. \u2026 \u201ca set of major shocks is sure to occur in the next 30 years.<br><br>We will not try to predict them or profit from them.\u201d (Btw, I love Buffett quotes the way women love muscular forearms)","url":"https://twitter.com/kejca/status/1828066879631507724","author":"kejca"},{"text":"Sell in person. Set up your lemonade stand and find out what works. Go to local street fairs. Set up a booth. Go door to door. Too much signal gets lost in digital. CAC is low because young brands dont know what people really think because they didnt take the risk of selling irl","commentary":"This guy made $100M selling 5 inch short-shorts to dudes. (Preston created Chubbies) I totally agree with his advice .<br><br>The fastest way to learn is to sell your product in person .<br><br>You can go to a fair, or conference, or host a meet up.<br><br>You\u2019ll learn more in 2 hours of \u2018live selling\u2019 than you will in 6 months behind a desk.<br><br>Btw - this works with any product.<br><br>Not just e-commerce.<br><br>When we were making social apps, I used to volunteer to teach at high schools.<br><br>At the end of class I\u2019d try to \u2018sell\u2019...","url":"https://twitter.com/prestonruther10/status/1813973846728593860","author":"prestonruther10"},{"text":"You don&#x27;t need to worry about progressing slowly. You need to worry about climbing the wrong mountain.","commentary":"The surprising thing is - even when people realize they\u2019re on the wrong mountain, they just keep going. \u201cPeople will choose unhappiness over uncertainty.\u201d - Tim Ferriss The great ones are different tho.<br><br>The great ones are willing to re-invent themselves.<br><br>They value their time over their comfort.<br><br>So they refuse to waste time on the wrong mountain.<br><br>They are willing to go back down to the bottom, and find a new trail - a new mountain to climb.<br><br>That\u2019s what makes them great.","url":"https://twitter.com/JamesClear/status/1828432783322100126","author":"JamesClear"},{"text":"\ud83d\udcaf","commentary":"This newsletter is my top of the pyramid \ud83d\ude02 P.S: I\u2019ve been scaling my sales &amp; customer service teams with some ace talent from South Africa.<br><br>They have native English and high closing rates.<br><br>I just hired a rep named Julian.<br><br>He\u2019s crushing it right now, and the market rate for sales guys with 2-3 years of experience is ~$18K/year. (big help to margins because we\u2019re bootstrapping the business) Here are four more reps in the pipeline that are ready to be hired: Keegan - 33 yrs old, experience in B2B...","url":"https://twitter.com/rothmus/status/1827858297572999350","author":"rothmus"}],"num":79},{"title":"5 Tweet Tuesday - August 20, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-august-20-2024","date":"2024-08-20","tweets":[{"text":"Having someone you can share tweets with is just a big flex, especially if they always get the context.","commentary":"Yes!!<br><br>That\u2019s us!!<br><br>That\u2019s what this email is all about!! **rips t-shirt in half, hulk hogan style, and runs around the room**","url":"https://twitter.com/baphacongo/status/1824503265578361102","author":"baphacongo"},{"text":"\ud83c\udfcb\ufe0f I made a Deadlift ETF with only companies with CEOs that lift weights or do fight sports (not just cardio) It outperforms the S&amp;P500 by 140% or 2.4x over the last 4 years! Lifting weights = $$$","commentary":"Hahah.<br><br>I\u2019d buy the deadlift ETF.<br><br>Some of the CEO responses: Brian Chesky (AirBnB) \u2013 \u201cI deadlifted 585 lbs in my early 20s (6 plates on each side)\u201d Brian Armstrong (Coinbase) \u2013 \u201cI\u2019ve been working out 6 days a week for quite a while now.<br><br>Good recent performance, but entered a rocky market post direct listing.<br><br>Good thesis to test!\u201d","url":"https://twitter.com/levelsio/status/1825582556638560479","author":"levelsio"},{"text":"Cold drinks are 75% of Starbucks bev sales - wild stat","commentary":"Many businesses are not what they appear: Airlines are credit card companies (not transportation) Calm is a sleep app (not meditation) Starbucks sells cold sweet drinks (not hot bitter coffee) Colleges sell their brand stamp (not education) What are other examples?","url":"https://twitter.com/Shwinnabego/status/1823082361472664040","author":"Shwinnabego"},{"text":"From @JamesClear newsletter: You don&#x27;t have to claim everything you feel.","commentary":"Tim Ferriss told me a great line on this subject.<br><br>He has interviewed hundreds of top performers/thinkers, and he said one line has always stuck with him.<br><br>It came from BJ Miller, a guy who worked in hospice care and has been with thousands of people as they died.<br><br>The line was: \u201cDon\u2019t believe everything you think.\u201d Just because a thought pops into your head doesn\u2019t make it true, or useful.<br><br>Interrogate your thoughts.<br><br>Find the ones that serve you, and ditch the rest.","url":"https://twitter.com/readswithravi/status/1824128864853143942","author":"readswithravi"},{"text":"Brilliant","commentary":"\ud83d\ude02","url":"https://twitter.com/ryangirdusky/status/1824083681830396159","author":"ryangirdusky"},{"text":"","commentary":"Here\u2019s what some readers are saying about my blog post last week: You can read it here!","url":"","author":"ShaanVP"}],"num":78},{"title":"Good Friday - August 16, 2024","url":"https://shaan.beehiiv.com/p/good-friday-august-16-2024","date":"2024-08-16","tweets":[{"text":": Forget the numbers. Focus on WHO follows me, not HOW MANY people follow me. Tim Ferriss once said this, and it stuck in my head: \u201cWould you rather 100,000 Americans, chosen at random, read your book? Or be invisible to them - but every attendee of Davos loves your work?\u201d \u2026obviously the latter. Obsessing over the number subscribers &amp;amp; followers is like watching grass grow - time-consuming and doesn&amp;#x27;t speed up the process. I try to ignore numbers. Instead, I focus on who loves my content. By the...","commentary":"","url":"","author":"ShaanVP"},{"text":": What should I talk about? My trainer has a great motto: \u201cthe product is just you, pushed out\u201d. I call this - finding your inner nerd. What is the thing that you nerd out about the most? The thing you have an insatiable thirst for? The thing that looks boring, or even like work to others, but feels like play to you? I remember going to my uncle\u2019s house one time, and he took me down to the basement to show me his (don\u2019t worry! it\u2019s not that kind of a story) \u2026 model train set. Every night, he\u2019d...","commentary":"","url":"","author":"ShaanVP"},{"text":": Build a magnet, not an audience. I think of content as a giant magnet. It should attract the type of people I want in my life. Every blog, every podcast, every video should be a honeypot to find like-minded people. The internet is a geography vaporizer. I love watching old Berkshire Hathaway meetings, playing basketball, and building startups. There\u2019s not a single person in the neighborhood I grew up in that likes those things. The internet makes it easy to find the 10,000 people who share my...","commentary":"","url":"","author":"ShaanVP"},{"text":": Remember the 5 D\u2019s Most people want to be famous. But I have a different goal... I don\u2019t want to be well known. I want to be known well. What does it mean to know me well? I have to share stories, hopes, dreams, fears, &amp;amp; obsessions. I call these the 5D\u2019s. *Done - what have I done? what&amp;#x27;s my track record? *Deliver - what do I offer people who follow me? *Do - what do I do for work? for fun? *Dreams - what am I shooting for? what\u2019s the dream? (eg. Gary V wants to buy the Jets) *Dork Out - wwhat...","commentary":"","url":"","author":"ShaanVP"},{"text":": OK, this is getting long. But you\u2019re still here. Weird, right? That\u2019s because there&amp;#x27;s no such thing as too long, only &amp;#x27;too boring&amp;#x27;. LESSON","commentary":"","url":"","author":"ShaanVP"},{"text":": Don\u2019t worry about your writing style or production quality. A+ content with C- delivery is a great starting point . C- content with A+ delivery is a death trap . Don&amp;#x27;t waste hours on packaging. Instead, spend years living an interesting life so that you actually have something interesting to say. Just look at Joe Rogan\u2019s first podcast episode: Ugly webcam, snowflake video effects, and a rainbow background. Fast forward to today, Rogan is the King of Podcasts. Why? He focused on content first,...","commentary":"","url":"","author":"ShaanVP"},{"text":": Create a binge bank. At the beginning, my numbers were small. Which led to doubts. I started thinking to myself\u2026 \u201cWhat&amp;#x27;s the point of even doing this?\u201d Here\u2019s the trick. Instead of thinking about the 8 people that will view my content today - I told myself I was building a binge bank. A binge bank is like a personal Netflix binge-worthy show. It\u2019s 1 hour worth of content, that if someone consumed, they would love me. So I tricked myself into thinking that in the future, people will discover...","commentary":"","url":"","author":"ShaanVP"},{"text":": People don\u2019t want information, they want a feeling. I started thinking of my channel as a little shop at the world&amp;#x27;s most crowded flea market. I\u2019m not selling things, I\u2019m selling a feeling. David Blaine sells the feeling of awe. James Clear sells the feeling of self-control. The UFC sells \u201choly shit!\u201d moments, live on PPV. Tony Robbins sells motivation. Crossfit sells a satisfying sweat. Give them the feeling once or twice, and you\u2019ll get a follow. Give them the feeling every day, and you\u2019ll...","commentary":"","url":"","author":"ShaanVP"},{"text":": \u201cBe so good they can\u2019t ignore you.\u201d I\u2019ve become friends with MrBeast over the past few years - and I love his attitude towards winning. Here\u2019s the advice he gives when people ask him how to become a successful YouTuber: \u201cMake 100 videos, and every video, try to do one thing better. Maybe it\u2019s the hook. Or the thumbnail. Or storytelling. Whatever. Just make one thing better, every time, then come back and talk to me after 100\u201d. This is amazing advice because it works, and because it shoo\u2019s...","commentary":"","url":"","author":"ShaanVP"}],"num":77},{"title":"5 Tweet Tuesday - August 13, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-august-13-2024","date":"2024-08-13","tweets":[{"text":"personality is the sum of your quirks. no quirks, no personality.","commentary":"A funny observation of life: I spent the first 18 years of my life trying to FIT IN at school.<br><br>I tried to blend in.<br><br>Hide my weird quirks.<br><br>They were a liability.<br><br>Then - I\u2019ve spent the rest of my life trying to STAND OUT.<br><br>Embracing my quirks.<br><br>Want to get a job or date?<br><br>Don\u2019t blend in with the crowd.<br><br>Stand out.<br><br>My quirks became an asset.<br><br>This is something I\u2019m going to try to teach my kids.<br><br>Keep your quirks.","url":"https://twitter.com/anuatluru/status/1821948802267263157","author":"anuatluru"},{"text":"The main forms of luck in life as an adult are having an amazing partner, loving your work, and having your health. Everything else is accoutrements.","commentary":"I love the phrasing - \u201ceverything else is accouterments\u201d.<br><br>So true.<br><br>The 80/20 of quality of life is health, family &amp; enjoying your work.","url":"https://twitter.com/jaltma/status/1822377904682180843","author":"jaltma"},{"text":"Gut health is the next mental health","commentary":"I call these 1-chart businesses.<br><br>I have a friend crushing with a gut supplement business right now.<br><br>The numbers are insane.<br><br>He doesn&#x27;t need a 20-page business plan.<br><br>He just needs this 1-chart.<br><br>That&#x27;s it.<br><br>This is the story of why the business is winning.<br><br>Gut health, microplastics/forever chemicals, and Ozempi - that&#x27;s the holy trinity of health trends right now.<br><br>Huge waves to surf as a founder.","url":"https://twitter.com/ScottHickle/status/1821018261267394901","author":"ScottHickle"},{"text":"&quot;If it hurts to hear it, look for the truth in it. If it comforts to hear it, look for the lie in it.&quot; @naval","commentary":"Wise.<br><br>If someone calls me an ugly turtle.<br><br>It has no affect.<br><br>I see no truth in it.<br><br>If someone calls me a \u2018fake guru\u2019, I get a little defensive!<br><br>Why?<br><br>Because I fear there\u2019s some truth in it.<br><br>My freshman roommate had a poster on the wall.<br><br>He put it up on our first day of move-in, and it was the poem IF.<br><br>I looked at that poster probably 4 million times.<br><br>It had one amazing line: \u201cIf you can meet with Triumph and Disaster And treat those two impostors just the same;\u201d - Rudyard Kipling.","url":"https://twitter.com/NavalismHQ/status/1822168755553661044","author":"NavalismHQ"},{"text":"Shut up before I open a Nature Valley bar on your bed","commentary":"\ud83d\ude02 PS - if you\u2019re hiring sales people for your company - check this out.<br><br>This thread has a few incredible candidates available for hire today.<br><br>They\u2019re in South Africa, perfect english, with sales experience, for less than $10 per hour.<br><br>This edition of 5TT is brought to you by Somewhere.com - helping you hire incredible talent that cost 5X LESS by finding top talent for you overseas.<br><br>People think hiring overseas is for virtual assistants.<br><br>THEY COULDN\u2019T BE MORE WRONG.<br><br>I\u2019ve rebuilt the sales teams...","url":"https://twitter.com/jackienotjaclyn/status/1823044052553548152","author":"jackienotjaclyn"}],"num":76},{"title":"5 Tweet Tuesday - August 6 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-august-6-2024","date":"2024-08-06","tweets":[{"text":"figure out what comes easy to you, then go hard at it","commentary":"Great way to put it.","url":"https://twitter.com/anuatluru/status/1820596263248875988","author":"anuatluru"},{"text":"I need the people to know that olympic silver medalist giorgia villa is sponsored by parmesan cheese and regularly posts pics of herself with giant wheels of cheese","commentary":"So many great names\u2026 Ace.<br><br>Hugo.<br><br>Rocco.<br><br>Egor.<br><br>Yet the best my parents came up with was\u2026 Ben.","url":"https://twitter.com/slothanova/status/1818681698667667720","author":"slothanova"},{"text":"I&#x27;m not really a prospects guy but the names in next year&#x27;s NBA draft class are like 10x better than this year. Ace Bailey. V.J. Edgecombe. A 7&#x27;3&quot; guy from Brisbane named Rocco Zikarsky. Good vibes all around.","commentary":"So true\u2026 people only remember the weird things.","url":"https://twitter.com/NateSilver538/status/1816992702086402153","author":"NateSilver538"},{"text":"Imagine what you&#x27;d attract if you didn&#x27;t shave off your weird edges","commentary":"\ud83d\ude02 IF YOU MADE IT THIS FAR,","url":"https://twitter.com/rrhoover/status/1818725398881911188","author":"rrhoover"}],"num":75},{"title":"5 Tweet Tuesday - July 30, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-july-30-2024","date":"2024-07-30","tweets":[{"text":"\u201cIf you are not aggressive, you are not going to make money, and if you are not defensive, you are not going to keep money.\u201d","commentary":"Wise words.","url":"https://twitter.com/readswithravi/status/1816000207836045528","author":"readswithravi"},{"text":"$1M business idea: Sleep gamification. Pokemon Sleep made $100M in its first year \ud83d\ude31 Basically an iPhone app that tracks your sleep and lets you collect Pokemon &amp; level up if you get good sleep.","commentary":"WOW. $100M in Year 1?!<br><br>This app is a sleep tracker.<br><br>You put your phone on your pillow, and it tracks your sleep - but they gamified it to \u201ccatch Pokemon\u201d based on your sleep quality.<br><br>I\u2019m a big fan of turning health tracking into games, rather than just hardcore numbers.","url":"https://twitter.com/thepatwalls/status/1817388873288233355","author":"thepatwalls"},{"text":"Obsessed with this guy on the US men&#x27;s gymnastics team who&#x27;s only job is pommel horse, so he just sits there until he&#x27;s activated like a sleeper agent, whips off his glasses like Clark Kent and does a pommel horse routine that helps deliver the team its first medal in 16 years.","commentary":"Me in every corporate meeting.","url":"https://twitter.com/MegWritesBooks/status/1817993333827842252","author":"MegWritesBooks"},{"text":"do you have any default rules for your life? like &quot;no bread&quot; or &quot;always go on 2 dates&quot; something","commentary":"Fun question\u2026 here\u2019s some of my rules for life: If someone is rude to a waiter or Uber driver, they suck, do not befriend.<br><br>Always pour water into people\u2019s cups at the table.<br><br>It\u2019s the little things.<br><br>Eat before going grocery shopping.<br><br>Turn every relationship into a giving contest.<br><br>Aim to give more than the other person.<br><br>Don&#x27;t drink your calories.<br><br>Walk into a room or house with big &quot;HONEY IM HOME&quot; energy.","url":"https://twitter.com/christineist/status/1816257836764258420","author":"christineist"},{"text":"My wife when I leave the toilet seat up","commentary":"\ud83d\ude02\ud83d\ude02","url":"https://twitter.com/SirajAHashmi/status/1816182718608334983","author":"SirajAHashmi"}],"num":74},{"title":"5 Tweet Tuesday - July 23, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-july-23-2024","date":"2024-07-23","tweets":[{"text":"&quot;You don&#x27;t have to be brilliant, only a little bit wiser than the other guys, on average, for a long, long time.&quot;","commentary":"Compounding has 3 parts, but everyone focuses on the first two. 1 - rate of growth (%) 2 - starting amount 3 - length of runway (patience) Buffett &amp; Munger don\u2019t have the highest rate of growth (theirs is around ~20% annually) but they did it for 50+ years.<br><br>As Morgan Housel said: \u201cHis skill is investing, but his secret is time\u201d. 99% of Buffett\u2019s net worth was accumulated after he turned 65.","url":"https://twitter.com/farnamstreet/status/1813241360700350920","author":"farnamstreet"},{"text":"A fantastic point. Get started today.","commentary":"An insightful little gem from Tumblr of all places.","url":"https://twitter.com/GigaBasedDad/status/1814774533162999861","author":"GigaBasedDad"},{"text":"Airbnb cofounder: &quot;I thought of a way to make a few bucks&quot;","commentary":"This is the email that created AirBnB (now, a $94B company) The line that stood out to me?<br><br>The simple: \u201cHa!\u201d at the end.<br><br>Big ideas are often disguised in quirky, small packages.<br><br>What if we could push a button and a private driver showed up to pick us up, Ha!<br><br>What if we sent each other photos that self-destruct after 10 seconds, Ha!<br><br>What if we created a digital currency, based on math instead of government, Ha!","url":"https://twitter.com/TechEmails/status/1550261661012897792","author":"TechEmails"},{"text":"&quot;The ability to play chess is the sign of a gentleman. The ability to play chess well is the sign of a wasted life.&quot; Paul Morphy once said this, maybe the best chess player in the world in the 1850s, and it&#x27;s always stuck with me, I haven&#x27;t been able to shake it","commentary":"I think there\u2019s a lot of wisdom in this.<br><br>I first noticed this in my life about Poker.<br><br>Getting to to the top 10% of players was a thrill, and taught me so many useful things.<br><br>But trying to grind to the top 1% would have been a waste of the next 10 years.<br><br>I think this applies to making money too.<br><br>I know many people who\u2019ve already earned the last dollar they\u2019ll ever spend.<br><br>Now trading more life-hours for money is a foolish trade, but they can\u2019t help themselves.","url":"https://twitter.com/DylanoA4/status/1814351650472997212","author":"DylanoA4"},{"text":"feel like a lot of women in their 30s are torn between sticking with their bf who\u2019s honestly not a great candidate but he\u2019s the nominee or risking the chaos of an open convention","commentary":"A+ politics / dating crossover joke \ud83d\ude02 BONUS \ud83d\udc8e Most business books are bad, this one is really good.<br><br>I chewed it up in 3 days This had the 3 things I like in a book: - stories (negotiating a deal with Charlie Munger) - numbers (exact deal terms) - lessons (from mistakes)","url":"https://twitter.com/kukukadoo/status/1814408062062809106","author":"kukukadoo"}],"num":73},{"title":"5 Tweet Tuesday - July 16, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-july-16-2024","date":"2024-07-16","tweets":[{"text":"what&#x27;s the tell-tale sign that someone is actually happy / content in their life?","commentary":"This post got over 1,000+ replies.<br><br>Here\u2019s the best ones: \u201cThey\u2019re happy for other people\u2019s happiness\u201d - Alex F. \u201cLaugh at themselves often (don\u2019t take themselves too seriously)\u201d -George M. \u201cRarely put others down/criticize.<br><br>They assume positive intent of others\u201d \u201cIf you watch them, they\u2019ve got a pep in their step when they walk.<br><br>Or they\u2019re humming a song to themselves\u201d \u201cNot on social media/not on their phone too much.<br><br>Deeply present when you talk to them\u201d Love these as a simple-guide to happy...","url":"https://twitter.com/ShaanVP/status/1773428422959862223","author":"ShaanVP"},{"text":"I love asking people what they have unreasonably high standards for. The answers are always very revealing. And if they don\u2019t have an answer\u2014well, that\u2019s also revealing. So, what do you have \u201cunreasonably\u201dhigh standards for?","commentary":"This is a thought provoking question.<br><br>At some level, you are your standards. (you become what you tolerate) My answer: \u201cI have an unreasonably high standard for my day-to-day mood\u201d I find that most people are completely \u201cOK\u201d with simply reacting to what happens that day.<br><br>Their mood flip flops based on the weather, the news, their boss etc..<br><br>Whereas I treat my mood as my fortune.<br><br>I hold myself to an unreasonable standard for what mood I\u2019m in from moment to moment.","url":"https://twitter.com/_TamaraWinter/status/1813221352322503094","author":"_TamaraWinter"},{"text":"\u201cWow. It worked. I fell asleep. Crazy.\u201d Watch this video of @thatguybg wake up from a nap with @elemindtech \u2019s sleep headband in the middle of the day, on a moon pod, in a conference room:","commentary":"yo\u2026 I want one of these so bad.<br><br>A headband that helps knock-you-out for naps instantly?<br><br>Dear god please let this be real.<br><br>If I was on game of Thrones they\u2019d introduce me like this: Shaan Puri, First of His Name, King of the Afternoon Nap, Sultan of Snooze, His Fully Rested Excellencey.","url":"https://twitter.com/meredithperry/status/1813029541499314245","author":"meredithperry"},{"text":"Yesterday, I read this quote from @JamesClear and it hit me hard.","commentary":"This reminds me of my Uncle Vinney.<br><br>He\u2019s like 70 something years old, but he\u2019s the energizer bunny.<br><br>Fully excited about life.<br><br>Has new dreams all the time.<br><br>Constantly trying new things.<br><br>Genuinely feels his best days are ahead of him.<br><br>All of his peers (my uncles/aunts) feel like they\u2019re slowly packing up their bags at the end of a long vacation called Life.<br><br>Whereas he\u2019s got his backpack on and hitchhiker thumb out ready to roll to the next adventure.<br><br>It\u2019s the right kind of delusion.<br><br>That\u2019s my...","url":"https://twitter.com/brynncwalker/status/1811743235498270906","author":"brynncwalker"},{"text":"Well my ex canceled the Spotify premium I was using which unfortunately means I am revoking her Dads access to my Disney +.\u00a0\u00a0Good guy. Hate to see him caught in the crossfire","commentary":"\ud83d\ude02 P.S. - I\u2019ve recently started WRITING again.<br><br>And I love it.<br><br>I\u2019m going to start sending some of my essays/blog posts to this list.<br><br>No action needed on your end, just a heads up that I\u2019m going to be sending some fun wisdom your way soon.\u270c\ufe0f","url":"https://twitter.com/CraigAdams42069/status/1812681741678658013","author":"CraigAdams42069"}],"num":72},{"title":"5 Tweet Tuesday - July 9, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-july-9-2024","date":"2024-07-09","tweets":[{"text":"You can predict the long term health of a relationship by whether each cut heals to 99% or 101%.","commentary":"This is actually a very powerful idea.<br><br>Relationships have arguments, disagreements, fights and ugly moments.<br><br>Those are \u201ccuts\u201d.<br><br>You said something or did something.<br><br>They said something or did something.<br><br>Cut. cut, cut.<br><br>It\u2019s inevitable.<br><br>Cuts will happen.<br><br>Which means - the part that\u2019s in our control is what happens after the cut.<br><br>Do you heal to 99%...or 101%?<br><br>It sounds small.<br><br>Just 2%.<br><br>But it\u2019s a massive difference. 99% means, eventually the relationship decays to zero. 101% means it gets better and...","url":"https://twitter.com/mmay3r/status/1257853216173076481","author":"mmay3r"},{"text":"Having a prototype is 10x more valuable than a design. Having a design is 10x more valuable than having a little doc. Having a doc is 10x more valuable than having an idea in your head.","commentary":"Here\u2019s two principles I use in my companies (feel free to steal): Don\u2019t debate, if the data is available (get the data first, then discuss) \u201cA prototype is worth a thousand meetings\u201d (building a simple way to \u2018taste test\u2019 is often faster AND better than trying to figure things out in our heads)","url":"https://twitter.com/Suhail/status/1810309490480238869","author":"Suhail"},{"text":"How to actually get 12 weeks of work done in 9 days: \u201cGo on vacation\u201d then don\u2019t go anywhere and just work with no interruptions for 9 days straight.","commentary":"Actually - I have a twist on this.<br><br>Go on a \u2018work vacation\u2019 Rent a cabin.<br><br>Invite your 1-2 closest collaborators.<br><br>Don\u2019t leave cabin for 7 days.<br><br>Work \u201ctwo-a-days\u201d (9am-4pm, break/eat/hike, work again 7pm-2am) You\u2019ll make 2-3 months work of progress in 1 week.<br><br>I\u2019ve done this many many times (used to call these hackweeks), and works every time.","url":"https://twitter.com/AlexHormozi/status/1807584961655898510","author":"AlexHormozi"},{"text":"Jean-Paul Sartre, damn","commentary":"Love this writing.<br><br>I recently started blogging (for the first time in years!) and wrote a post on the same topic, called Someday","url":"https://twitter.com/DylanoA4/status/1809956631855104102","author":"DylanoA4"},{"text":"why does this go kinda hard","commentary":"\ud83d\ude02","url":"https://twitter.com/computer_gay/status/1808982029721026656","author":"computer_gay"}],"num":71},{"title":"5 Tweet Tuesday - July 2, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-july-2-2024","date":"2024-07-02","tweets":[{"text":"&quot;If you want to make the wrong decision, ask everyone.&quot; @naval","commentary":"&quot;I&#x27;ve searched all the parks in all the cities and found no statues of committees&quot; - Gilbert Chesterton","url":"https://twitter.com/NavalismHQ/status/1471641291175841793","author":"NavalismHQ"},{"text":"pic.twitter.com/tHptJjhSLx","commentary":"The midwit in the middle can&#x27;t believe they spent $200K getting an MBA to find out that you just need to send the prospect donuts.","url":"https://twitter.com/typesfast/status/1806349769238774134","author":"typesfast"},{"text":"Boston Celtics are selling for ~$5B Jayson Tatum resigned for $314m over 5 years. New CEOs typically get 5-10% stock issuance over 4 years. When will franchise players start getting on the cap table?","commentary":"Wyc Grousbeck bought the Celtics in 2002 for $360M.<br><br>He&#x27;s selling the team now for an asking price of $5 Billion (11% compounded annually)\u2026that beats the S&amp;P 500 during the longest bull market in American history.<br><br>Oh, and unlike a stock, he got to sit courtside watching a team that he owns win 2 championships.<br><br>Winning!","url":"https://twitter.com/lifeofbi/status/1808191045940936950","author":"lifeofbi"},{"text":"My biggest, why the f**k did I not do this earlier, by years: 2024 - TSA pre check 2023 - LASIK surgery 2022 - Buy a great water bottle 2021 - Standing desk 2020 - Amazing pillow 2019 - Tailored all my pants What should be on my radar for 2025?","commentary":"Off the top of my head: buying 3 TV remotes so that even when one goes missing in the couch, I got 2 more on-deck buying 100 pairs of the same sock, so that there&#x27;s no mismatches go for a walk at night after dinner/kids go to sleep water pic flosser 1 phone charger per room, that never moves","url":"https://twitter.com/BrianLaManna_/status/1805021137597816925","author":"BrianLaManna_"},{"text":"&quot;free in-store pickup?&quot; yeah. thats what store is.","commentary":"\ud83d\ude02","url":"https://twitter.com/PhilJamesson/status/1806838245021372603","author":"PhilJamesson"}],"num":70},{"title":"5 Tweet Tuesday - June 25 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-june-25-2024","date":"2024-06-25","tweets":[{"text":"Real","commentary":"What a great quote.<br><br>For many of us, this is why we shouldn\u2019t ask our parents for advice.<br><br>My parents were great parents.<br><br>Love them.<br><br>But many of the things I want in life, were things they\u2019ve never done.<br><br>For example - I wanted to be an entrepreneur and start a company.<br><br>But my parents had never done that.<br><br>They worked in jobs for 40 years.<br><br>So when it came to career advice, I largely had to ignore their advice - because they can\u2019t give me directions to a place they\u2019ve never been.","url":"https://twitter.com/MrFourToEight/status/1804565615778111662","author":"MrFourToEight"},{"text":"&quot;There are two ways to use money. One is as a tool to live a better life. The other is as a yardstick of success to measure yourself against other people. The first is quiet and personal, the second is loud and performative. It\u2019s so obvious which leads to a happier life.&quot;\u2026 x.com/i/web/status/1\u2026","commentary":"So true.<br><br>Too many successful people fall into the trap of \u201cmoney as a measuring stick\u201d.","url":"https://twitter.com/mikekarnj/status/1804472411133247697","author":"mikekarnj"},{"text":"When Novak Djokovic said this after winning the Australian Open in 2012. One of the coldest quotes I can remember. This guy is built different.","commentary":"Is this a good time to talk about the Cinnabon gift card I recently bought?","url":"https://twitter.com/Zwxsh/status/1804417233155953137","author":"Zwxsh"},{"text":"With every yes, comes a stress.","commentary":"I had a big epiphany recently.<br><br>Jason Fried said on my podcast:\u00a0 \u201csaying yes to one thing, means you\u2019re secretly saying \u201cno\u201d to hundreds of other options in the future.<br><br>Saying no to one thing, is just no to that one thing\u201d Loved that perspective.","url":"https://twitter.com/awilkinson/status/1804971959186497581","author":"awilkinson"},{"text":"You can do anything if you start a podcast. Date Taylor Swift, coach the Lakers, there are no limits to the fruits it may bear","commentary":"\ud83d\ude02","url":"https://twitter.com/ColeyMick/status/1803868330388001190","author":"ColeyMick"}],"num":69},{"title":"5 Tweet Tuesday - June 18, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-june-18-2024","date":"2024-06-18","tweets":[{"text":"have never seen a well run business.\u00a0\u00a0ever.\u00a0\u00a0the best businesses are mediocrely run. all businesses are loosely functioning, disasters, and some happen to make money","commentary":"So true.<br><br>I used to think \u201cman, this company is such a sh*tshow.<br><br>Other companies must have it figured out\u201d Then I realized, nobody has it figured out.<br><br>Every company is messy.","url":"https://twitter.com/auren/status/1800974681429901479","author":"auren"},{"text":"\u201cBetter to get your dopamine from improving your ideas than having them validated. \u201c \u2014 @natfriedman","commentary":"Good thought experiment: \u201cwhere do I get my dopamine from?\u201d It\u2019s like your macros.<br><br>You can get calories from doritos, or from grilled chicken &amp; broccoli.<br><br>Are you getting dopamine from Instagram likes?<br><br>Or from learning a new song on the piano?<br><br>Cheap dopamine is sugar for your brain.","url":"https://twitter.com/ChrisWillx/status/1802008163170009294","author":"ChrisWillx"},{"text":"The motto of every entrepreneur You have to be optimistic to the point of na\u00efvet\u00e9 to start a business.","commentary":"Getting one of these printed for my house.","url":"https://twitter.com/mikebeckhamsm/status/1801617632925261892","author":"mikebeckhamsm"},{"text":"I regret to inform you that doing literally 5 mins of breathing at 6 breaths per minute every night before bed will massively activate your parasympathetic nervous system allowing you to fall asleep quicker, and sleep for longer and deeper. Don\u2019t underestimate this.","commentary":"If meditation hasn\u2019t clicked for you - try breathwork.<br><br>Highly recommend this app, Othership.<br><br>I do the 5-7 minute sessions in the morning - it\u2019s great music + guided breathwork.","url":"https://twitter.com/BreathingByEd/status/1802652326915670044","author":"BreathingByEd"},{"text":"innvoator. dreamer. genius.","commentary":"\ud83d\ude02","url":"https://twitter.com/ShaanVP/status/1801657383955141073","author":"ShaanVP"}],"num":68},{"title":"5 Tweet Tuesday - June 11, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-june-11-2024","date":"2024-06-11","tweets":[{"text":"Shyness is extremely expensive","commentary":"Being shy is a silent cost.<br><br>It\u2019s like striking out looking in baseball.<br><br>Too shy to ask == miss out on all the times the answer was \u2018yes\u2019.<br><br>Shy away from opportunities == miss out on the upside.<br><br>Too shy to talk == you don\u2019t attract like-minded people.","url":"https://twitter.com/realestatetrent/status/1798020662591889799","author":"realestatetrent"},{"text":"Penny stock trading is more popular than ever: Trading volume of US stocks worth less than $1 accounted for ~14% of the total stock market volume. This share has more than tripled in just 5 years and now stands at a record high. Penny stock volumes now are even higher than\u2026 x.com/i/web/status/1\u2026","commentary":"This is breaking my brain\u2026 Penny stock volume has tripled in 5 years, and is now 14% of total stock market volume?<br><br>Damn.<br><br>Gambling is growing everywhere.<br><br>From crypto to sports betting to penny stocks to GameStop.<br><br>Everyone wants the magic lottery ticket.","url":"https://twitter.com/KobeissiLetter/status/1799097903908331981","author":"KobeissiLetter"},{"text":"Warren Buffett on incentives and the national deficit: \u201cI can end the deficit in 5 minutes You just pass a law that says that any time there is a deficit of more than 3% of GDP all sitting members of congress are ineligible for reelection.\u201d","commentary":"\u201cShow me your incentive and I\u2019ll show you your outcome\u201d - Charlie Munger","url":"https://twitter.com/baldridgecpa/status/1800370918063227182","author":"baldridgecpa"},{"text":"Never regret a day in your life. Good days give happiness, bad days give experiences, worst days give lessons, and best days give memories.","commentary":"Like a pizza, this tweet is cheesy but good.","url":"https://twitter.com/ValaAfshar/status/1799960415272669463","author":"ValaAfshar"},{"text":"pic.twitter.com/s25yqmz7qY","commentary":"\ud83d\ude02 (I showed this to my wife, and she didn\u2019t laugh.)","url":"https://twitter.com/Rothmus/status/1800288754893996479","author":"Rothmus"}],"num":67},{"title":"5 Tweet Tuesday - June 4, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-june-4-2024","date":"2024-06-04","tweets":[{"text":"\u201cIf you want a new idea, read an old book.\u201d","commentary":"3 books I\u2019m reading right now: The Creative Act: A Way of Being by Rick Rubin Never Enough: From Barista to Billionaire - draft of Andrew Wilkinson&#x27;s new book, coming out in July Speak Like Churchill, Stand Like Lincoln: 21 Powerful Secrets of History&#x27;s Greatest Speakers by James C.<br><br>Humes Who\u2019s got a great book recommendation for me?","url":"https://twitter.com/readswithravi/status/1797432951376105759","author":"readswithravi"},{"text":"Indeed.","commentary":"This is a great quote.<br><br>But let\u2019s be real\u2014robots already do your dishes &amp; laundry.<br><br>Dishwashers and washing machines.<br><br>That\u2019s two robots living in your house already!","url":"https://twitter.com/AlexGPickering/status/1796990602716066042","author":"AlexGPickering"},{"text":"this will last forever","commentary":"This insight explains why there is so much bullshit in the world.<br><br>Easy to make, hard to remove.","url":"https://twitter.com/StephanSturges/status/1795874172939415627","author":"StephanSturges"},{"text":"By constantly shorting Tesla for years the fund of Jim Chanos has lost 96% of its value from $6bn in 2008 down to $200m in Nov 2023. Never bet against Elon.","commentary":"Kids: \u201cHey Grandpa!<br><br>What did you do in your career?\u201d Chanos: \u201cI bet against the greatest entrepreneur alive for a decade, and as my reward, I lost 6 billion dollars.\u201d","url":"https://twitter.com/alex_avoigt/status/1795589571142636000","author":"alex_avoigt"},{"text":"This is what product-market fit looks like","commentary":"I&#x27;m going to tell my kids this was Drake\u00a0\ud83d\ude02 PS: Someone tweeted out a video of what it looks like to refer a friend to this newsletter.<br><br>This could be you!<br><br>All you have to do is\u2026 share this link .","url":"https://twitter.com/venturetwins/status/1798036635252322723","author":"venturetwins"}],"num":66},{"title":"5 Tweet Tuesday - May 28, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-may-28-2024","date":"2024-05-28","tweets":[{"text":"Don\u2019t succumb to peer pressure, because they\u2019re not your peers.","commentary":"Good reminder.<br><br>Only get peer pressured by people you actually want to be like, in that specific area of life! (example: it\u2019s good to get peer pressured by your fit friends, if you want to be fit)","url":"https://twitter.com/naval/status/1794947856895508802","author":"naval"},{"text":"My favorite play is coming to SF &amp; tix are available. &quot;The Lehman Trilogy&quot; is an epic 3.5h play that covers 160 yrs of history of the Lehman Brothers, with all characters played by only 3 actors.\u00a0\u00a0I saw it in London in 2019 and will see it again in SF. \ud83d\udc47\ud83c\udffe","commentary":"Just bought tix to the Lehman brothers play next week.<br><br>I wish there was more business entertainment out there.<br><br>Right now my favorite \u2018business movies/shows\u2019 ever are: Popular ones everyone knows about: The Big Short Silicon Valley HBO Social Network Jerry Mcguire (ok, not really a business movie, but a great movie) Less Popular, But Great: General Magic (documentary) Boiler Room Blackberry The Apprentice (RIP) Office Space","url":"https://twitter.com/pitdesi/status/1790769408614580383","author":"pitdesi"},{"text":"You should be less afraid of short term risk and more afraid of mediocrity. If the co crashes and burns in a 1 year, you\u2019re only out 1 year. The investor loses all their money. Your nemesis is meh long term results. Investors don\u2019t get returns either but it costs you extra time.","commentary":"When I was 24, I wrote a memo to the company called \u201cMediocrity is the real risk\u201d .<br><br>Failure is painful, but most businesses fail to get product-market-fit so it\u2019s over quickly.<br><br>The more dangerous thing is mediocrity, because it drains you of your most valuable asset, your time.","url":"https://twitter.com/eshear/status/1793644419356545446","author":"eshear"},{"text":"If I could go back in time I&#x27;d tell myself to learn how to code. If I could give advice to current student&#x27;s I&#x27;d tell them to learn how to read fast, write well, and communicate effectively.","commentary":"In both cases, the real thing is learning how to \u2018think\u2019.<br><br>Writing, coding, talking \u2013 these are all just ways to think out loud.<br><br>Practicing doing them, is a stealth way to practice thinking.","url":"https://twitter.com/jonwu_/status/1795243593172676867","author":"jonwu_"},{"text":"He died doing what he loved: Requesting edit access.","commentary":"\ud83d\ude02","url":"https://twitter.com/MEPFuller/status/1794119220751396950","author":"MEPFuller"}],"num":65},{"title":"5 Tweet Tuesday - May 21, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-may-21-2024","date":"2024-05-21","tweets":[{"text":"Learn to ask, \u201cIf this is the only thing I accomplish today, will I be satisfied with my day?\u201d","commentary":"This is how I run my life.<br><br>No to-do lists.<br><br>I just wake up and pick my \u201cone big thing\u201d to focus on for the day.<br><br>The one big thing is: an outcome, not a task something that if I ONLY accomplished this one thing, the day would be a win.<br><br>It\u2019s the best way to be impactful, without being constantly \u2018busy\u2019.","url":"https://twitter.com/tferriss/status/1788899706845679734","author":"tferriss"},{"text":"","commentary":"What an insane niche business.<br><br>They started it in 2017, pitched Apple, and won the recycling business.<br><br>They do $440M+ a year in revenue, only raised $2.5M, and sell 15,000 refurbished iPhone 8s per day.","url":"","author":"ShaanVP"},{"text":"\u201cRaising venture capital is the art of younger men seducing older men.\u201d","commentary":"\ud83d\ude02","url":"https://x.com/rohitdotmittal/status/1792362856790241469","author":"rohitdotmittal"},{"text":"The beginner chases the right answers. The master chases the right questions.","commentary":"&#x27;The man who asks a question is a fool for a minute, the man who does not ask is a fool for life.&#x27;","url":"https://twitter.com/arjunkhemani/status/1791524965583298902","author":"arjunkhemani"},{"text":"AirBnBs are like \u201cwhat if hotels also came with errands\u201d","commentary":"\u201cHey, so that\u2019ll be a $100 cleaning fee, and then also clean the whole house yourself too.<br><br>Thanks!\u201d \ud83d\ude02 BONUS \ud83d\udc8e We spent $400,000 on the domain Somewhere.com to rebrand Support Shepherd.<br><br>What do you think - Worth it or Not?<br><br>Support Shepherd dropped a bag to rebrand to Somewhere.com (as in \u201cTalent is Everywhere, Find them with Somewhere\u201d) What do you think, good move or no?","url":"https://twitter.com/JamesClear/status/1790769865810161923","author":"JamesClear"}],"num":64},{"title":"5 Tweet Tuesday - May 14, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-may-14-2024","date":"2024-05-14","tweets":[{"text":"the ceiling of how good life can be is so much higher than I was told was possible","commentary":"So true.<br><br>Reminds me of the Airbnb \u201c11-Star Experience\u201d exercise for building companies.<br><br>Can be applied to life too.","url":"https://twitter.com/nickcammarata/status/1789929903841841548","author":"nickcammarata"},{"text":"Anxiously awaiting the @OpenAI announcements coming in 15 min. It&#x27;s something @sama said &quot;feels like magic&quot;. If it feels like magic to *him* (he has a high bar), it&#x27;s going to be big. Such exciting times to be a developer.","commentary":"How big is AI?<br><br>Dharmesh is the CTO of a $30B company and he\u2019s tweeting out excitement for the new openAI announcements\u2026 reminds me of Apple events when Steve Jobs (RIP) was running the show.<br><br>Btw what they announced: a bunch of random things (desktop app, etc.), and a huge speed/cost improvement.<br><br>Reducing latency isn\u2019t as sexy \u201cwatch this magic AI demo!\u201d but it\u2019s a huge unlock.<br><br>Speed is a killer feature.","url":"https://twitter.com/dharmesh/status/1790061891697434970","author":"dharmesh"},{"text":"How The Sphere makes money. The $2.3B venue reported $170M in revenue in Q3: - The Postcard From Earth show is the cash cow, with $1+ million in tickets sold per day ($101M) - Sponsors/ external ads ($33M) - Other events, like @U2 run ($34M) x.com/i/web/status/1\u2026","commentary":"Strip clubs aren\u2019t the only thing taking tech nerds\u2019 money in Vegas now!<br><br>I need someone to make a documentary about the making of the Sphere.<br><br>This thing seems incredible.<br><br>Technically, financially, experientially.<br><br>It\u2019s amazing something like this went from idea to reality.","url":"https://twitter.com/novy_williams/status/1788937351755919547","author":"novy_williams"},{"text":"Approx half of the top 20 apps in Education category are now AI cameras that do your homework for you","commentary":"There&#x27;s a golden generation right now that can use AI to cheat on everything, before the school system adapts to AI.<br><br>It&#x27;s like the Sammy Sosa/McGwire steroids era of education right now.","url":"https://twitter.com/adamludwin/status/1788306842940219627","author":"adamludwin"},{"text":"when we run out of something put it on the fridge so we don&#x27;t forget to buy it","commentary":"\ud83d\ude02 Wait this is genius.<br><br>Visual grocery list.","url":"https://twitter.com/MastersRex/status/1787103808838922509","author":"MastersRex"}],"num":63},{"title":"5 Tweet Tuesday - May 7, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-may-7-2024","date":"2024-05-07","tweets":[{"text":"i am like the opposite of artificial intelligence. genuine stupidity.","commentary":"I feel seen.","url":"https://twitter.com/surajdukhii/status/1785303591529652482","author":"surajdukhii"},{"text":"i don&#x27;t know any LLMs smarter than humans but i definitely know humans dumber than LLMs","commentary":"Back to back AI tweets in my newsletter.<br><br>That means we\u2019re at peak AI hype cycle.","url":"https://twitter.com/blader/status/1786151149315506468","author":"blader"},{"text":"&quot;You\u2019re never more prone to making a big mistake than right after big win.&quot; - Scott Galloway","commentary":"Love this quote.<br><br>Hubris is a b*tch.<br><br>Reminds me of the quote from the poem \u201cIF\u201d: \u201cIf you can meet Triumph &amp; Disaster - and treat those two imposters just the same\u201d.<br><br>This quote is at the 25:19 mark of the pod I did with Scott this week.","url":"https://twitter.com/ShaanVP/status/1787530137816420475","author":"ShaanVP"},{"text":"The more inflated the language in your startup&#x27;s pitch, the less convincing it seems. If you&#x27;re a seed stage company, don&#x27;t tell me you&#x27;re transforming global this or poised to dominate that. Tell me you noticed something that might turn out to be an overlooked opportunity.","commentary":"This is one of my biggest poker tells. \u201cThe bigger the words, the dumber the ideas\u201d","url":"https://twitter.com/paulg/status/1784208391402910126","author":"paulg"},{"text":"Had Sweetgreen for lunch instead of Chipotle","commentary":"\ud83d\ude02","url":"https://twitter.com/yo/status/1786104448357413352","author":"yo"}],"num":62},{"title":"5 Tweet Tuesday - April 23, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-april-23-2024","date":"2024-04-23","tweets":[{"text":"Alarm clocks are life shorteners","commentary":"Agree.<br><br>Starting the day with an unwanted interruption (or panic) is for the birds.<br><br>If an alarm clock is a life shortener...<br><br>What are the life extenders?<br><br>There&#x27;s the obvious candidates (exercise, clean eating, spending time w/ people you love)...but i think the most underrated one is napping.<br><br>The funny part is, America has such a &#x27;busy/stress = good&#x27; culture, that they&#x27;ll never nap.<br><br>They&#x27;ll keep chugging coffee, scrolling social media, and watching the news instead of taking a 1 hour nap.","url":"https://twitter.com/levelsio/status/1782017210073878633","author":"levelsio"},{"text":"pic.twitter.com/aKS6YYfa1J","commentary":"One of my favorite comics of all time.","url":"https://twitter.com/_jacksmith/status/1782418120046510466","author":"_jacksmith"},{"text":"Wendy&#x27;s is using FreshAI, their AI to automate drive thru ordering. Wild to see \ud83e\udd2f","commentary":"Fast food drive thru AI ordering is the biggest no brainer I&#x27;ve ever seen.<br><br>There are &gt;200k fast food restaurants in America.<br><br>Let&#x27;s do some make-believe math.<br><br>If you can replace a human with polite AI for $3.50/hour, that&#x27;s roughly ~$25k/yr in revenue, per location converted.<br><br>That&#x27;s a ~$5B prize pot for whoever makes AI that doesn&#x27;t suck at letting you order a large Big Mac, fries, and a diet coke (no pickles, bc pickles are gross).","url":"https://twitter.com/DThompsonDev/status/1782446072452780347","author":"DThompsonDev"},{"text":"One of my favourite all time quotes. \u201cMan cannot remake himself without suffering, for he is both the marble and the sculptor\u201d.","commentary":"A little tic tac of wisdom for today.","url":"https://twitter.com/IAmAaronWill/status/1782647295256690730","author":"IAmAaronWill"},{"text":"The surest sign of faithful monogamy.","commentary":"\ud83d\ude02 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I share the 5 best tweets I saw in the past 7 days.<br><br>Home Posts Authors \u00a9 2026 Shaan Puri.<br><br>Privacy policy Terms of use Powered by beehiiv","url":"https://twitter.com/girdley/status/1781034977536405865","author":"girdley"}],"num":61},{"title":"5 Tweet Tuesday - April 16, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-april-16-2024","date":"2024-04-16","tweets":[{"text":"Curiosity has created more opportunities than hard work ever will.","commentary":"Couldn\u2019t agree more.<br><br>Curiosity opens up bigger, more exciting opportunities than heads down hard work grinding.","url":"https://twitter.com/warikoo/status/1774049331068477655","author":"warikoo"},{"text":"If you already live a comfortable life, then choosing to make more money but live a worse daily life is a bad trade. And yet, we talk ourselves into it all the time. We take promotions that pay more, but swallow our free time. We already have a successful business, but we break\u2026 twitter.com/i/web/status/1\u2026","commentary":"Reminder to myself to read this, and re-read this every year","url":"https://twitter.com/JamesClear/status/1778484723263672776","author":"JamesClear"},{"text":"I pay what I owe. Tomorrow I will wire transfer to the IRS $288,000,000.00 This country has done so much for me, I\u2019m proud to pay my taxes every single year. Tag a former president that you know doesn\u2019t","commentary":"I never trust someone who brags about their civic duty.<br><br>They\u2019re usually overcompensating for something.<br><br>Also, just to calculate, he sold the Mavs for $3.5B and is paying $288M, which is &lt; 12% tax rate.<br><br>Shoutout to Marc\u2019s accountant, the real hero here. #3.5 \ud83d\udc8e I\u2019m doing a free workshop today for business owners/execs - sharing my delegation playbook: - the 1 metric management method - how to not f*ck up hires - my virtual assistant playbook You should come - It\u2019s at 11am PT/2pm ET I use this...","url":"https://twitter.com/mcuban/status/1779573824318521840","author":"mcuban"},{"text":"I\u2019m doing a free workshop today for business owners/execs - sharing my delegation playbook: - the 1 metric management method - how to not f*ck up hires - my virtual assistant playbook You should come - It\u2019s at 11am PT/2pm ET I use this method in every business I run, and\u2026 twitter.com/i/web/status/1\u2026","commentary":"Whether you agree or disagree with this description, it is useful to define different \u2018gears\u2019 for yourself.<br><br>Eg.<br><br>I have a \u201czen creativity\u201d gear, a \u201claser focus unstoppable CEO\u201d gear, and a \u201csilly playful dad\u201d gear that I shift between all day.","url":"https://twitter.com/ShaanVP/status/1780246747140493588","author":"ShaanVP"},{"text":"My favorite people are relentlessly intense in work, and completely relaxed in life Barbarian killer energy with making money Happy teddy bear energy with having fun Rare combination but it&#x27;s obvious when you see it","commentary":"\ud83d\ude02","url":"https://twitter.com/zachpogrob/status/1778205428922655224","author":"zachpogrob"}],"num":60},{"title":"5 Tweet Tuesday - April 9, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-april-9-2024","date":"2024-04-09","tweets":[{"text":"Instagram revenue was just disclosed for the first time in court filings. 2018: $11.3B 2019: $17.9B 2020: $22.0B 2021: $32.4B It makes more in ad revenue than YouTube (and likely at much higher gross margins!)","commentary":"hot damn!<br><br>Instagram is doing ~$32B a year in revenue (more than twitter, snapchat, and pinterest combined\u2026and more than youtube)","url":"https://twitter.com/tanayj/status/1777055129688056135","author":"tanayj"},{"text":"I consciously started Viaweb to get rich.","commentary":"breaking news: finally someone in silicon valley admits they started a business with a goal to get rich","url":"https://twitter.com/paulg/status/1776968663196749866","author":"paulg"},{"text":"We might witness a WNBA finals getting more views than a NBA finals in our lifetimes \ud83d\udc40","commentary":"my first reaction to this was \u201cno effing way\u201d but then I looked at the data and the women\u2019s college basketball game last week had more viewers than the Heat vs.<br><br>Celtics NBA game on TNT. \u2026and even better, that was the LSU/South Carolina game, not even a Caitlin Clark game! #3.5 \ud83d\udc8e \ud83d\udc40 If anybody out there reading this is working on SOC2 for their startup, hit reply to this emai eet-tuesday-march-5-2024","date":"2024-03-05","tweets":[{"text":"If you wouldn\u2019t ask them for advice, then fuck their criticism.","commentary":"banger.","url":"https://twitter.com/iammarkmanson/status/1764637039176163583","author":"iammarkmanson"},{"text":"New contender for best definition of strategy: \u201cStrategy is accepting that you are doing something better than the other and the other is doing something better than you. You have to pick your fight.\u201d - Axel Dumas, CEO of Hermes (via latest @AcquiredFM pod on Hermes)","commentary":"I call this the \u201cLaw of Corporate Bullsh*t\u201d You know how companies have values like \u201cExcellence!\u201d \u201cIntegrity!\u201d etc..<br><br>Those are useless in practice.<br><br>Who doesn\u2019t love excellence.<br><br>If the company says we do [THING], then it needs to come with the acknowledgement of the tradeoff otherwise it\u2019s just corporate fluff.<br><br>For example: Facebook\u2019s motto wasn\u2019t \u201cmove fast!\u201d - it was \u201cmove fast, and break things\u201d (acknowledging the tradeoff of moving fast)","url":"https://twitter.com/danhockenmaier/status/1761452735587827950","author":"danhockenmaier"},{"text":"Breaking through to a better idea by subtraction, rather than addition, is the most satisfying kind of breakthrough.","commentary":"I\u2019d normally add a caption here, but perhaps less is more\u2026","url":"https://twitter.com/jasonfried/status/1763356409650180439","author":"jasonfried"},{"text":"Reddit did 804m in revenue last year. Meta does 800m in revenue every 48 hours. Google does 800m in revenue every 24 hours.","commentary":"Stunning scale.","url":"https://twitter.com/SeanEcom/status/1764046150527787307","author":"SeanEcom"},{"text":"","commentary":"\ud83d\ude02","url":"","author":"ShaanVP"}],"num":54},{"title":"5 Tweet Tuesday - February 27, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-february-27-2024","date":"2024-02-27","tweets":[{"text":"The #1 thing I look atus/1759602029125632042","author":"anuatluru"},{"text":"Welp. It\u2019s been fun.","commentary":"the previous story was so long, I\u2019m not allowed to do more captions.","url":"https://twitter.com/camdoody/status/1758467659585265811","author":"camdoody"},{"text":"","commentary":"\ud83d\ude02","url":"","author":"ShaanVP"}],"num":52},{"title":"5 Tweet Tuesday - February 13, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-february-13-2024","date":"2024-02-13","tweets":[{"text":"You can measure how successful someone will be by how much they take responsibility when things go wrong and how little they take when things go right.","commentary":"Good signal.<br><br>How much credit is taken for wins, and blame for losses.<br><br>Btw. the answer isn\u2019t \u201czero credit for wins\u201d (fake humility) or \u201cfull blame for losses\u201d (unrealistic)...but high accountability for losses and high generosity for wins is the way.","url":"https://twitter.com/AlexHormozi/status/1757104839450828828","author":"AlexHormozi"},{"text":"I think $150k - $225k has to be the worst salary range. You make too much to say \u201cF*ck this place, I quit.\u201d Yet not enough to be financially free without a job for any significant amount of time.","commentary":"So true.<br><br>I see this all the time.<br><br>Anyone who\u2019s making ~$200k-$500k is trapped.<br><br>The salary completely blinds them &amp; paralyzes them from seizing opportunities.","url":"https://twitter.com/rishmishra/status/1757178807998660924","author":"rishmishra"},{"text":"Surprising result from my first year at YC: The most illuminating question about a startup idea in the beginning is not \u201cwhat are you building?\u201d but rather \u201cwho is it\u00a0\u00a0for?\u201d","commentary":"Here\u2019s the simple test: can you name the first person you\u2019d try to go sell this product to?<br><br>Eg. the last company I started, I knew exactly who the first 10 people I\u2019d talk to about it, and actually talk itter.com/jconorgrogan/status/1704136563062439940","author":"jconorgrogan"}],"num":36},{"title":"5 Tweet Tuesday - September 12, 2023","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-september-12-2023","date":"2023-09-12","tweets":[{"text":"","commentary":"I don\u2019t always write tweets, but when I do, they\u2019re First Class.","url":"","author":"ShaanVP"},{"text":"Levels in the entrepreneurial game - level 1 watching Iman Gadzhi &amp; Luke Belmar - level 2 watching Hormozi &amp; Alex Becker - level 3 watching Ycombinator - level 4 watching Howard Marks, Berkshire meetings, Peter Thiel, etc","commentary":"I have 3 reactions to this: I\u2019ve never even heard of the guys in Level 1, yay!<br><br>Shit, this is so true!<br><br>When I create content, it\u2019s a good reminder to be \u201cup-market\u201d rather than \u201cmass market\u201d.<br><br>Content is a product.<br><br>I\u2019d rather be the Phone, not the Android.<br><br>Mercedes, not Toyota.<br><br>Whole Foods, not Food4Less","url":"https://twitter.com/Thedonofstocks/status/1699505100807397800","author":"Thedonofstocks"},{"text":"Red Bull is worth 20B, Monster is worth 50B. Someone should build an energy drink brand for the productivity-chasing professional managerial class","commentary":"Interesting idea.<br><br>I think a \u201cproductivity shot\u201d or a \u201cfocus shot\u201d would work really well\u2026some combo of nootropics / caffeine.<br><br>Who\u2019s doing this?","url":"https://twitter.com/whrobbins/status/1699467541184405910","author":"whrobbins"},{"text":"Walter Isaacson&#x27;s Elon Musk book is out. It begins with the following quote: &quot;To anyone I&#x27;ve offended, I just want to say, I reinvented electric cars and I&#x27;m sending people to Mars in a rocket ship. Did you think I was also going to be a chill, normal dude?&quot;","commentary":"Love this quote. \u201cI re-invented electric cars and am sending people to mars\u2026did you think I was also going to be a chill, normal dude?\u201d Whoever wrote that for him at SNL, well done","url":"https://twitter.com/oldbooksguy/status/1701320193052705109","author":"oldbooksguy"},{"text":"My dad and I went to a restaurant and the waiter pointed at the QR code on the wall and said \u201cthats our menu\u201d and left and my dad looked at it really close and said \u201cIs this some kind of joke\u201d","commentary":"\ud83e\udd23\ud83e\udd23\ud83e\udd23","url":"https://twitter.com/johnistoasted/status/1317510825171689479","author":"johnistoasted"}],"num":35},{"title":"5 Tweet Tuesday - August 29, 2023","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-august-29-2023","date":"2023-08-29","tweets":[{"text":"\u201cOpportunities only look like opportunities in the rearview mirror. Today, they look like risk.\u201d","commentary":"What \u201crisks\u201d are you shying away from that later we will look back on as great opportunities?","url":"https://twitter.com/ChrisWillx/status/1695481233013383286","author":"ChrisWillx"},{"text":"I went to visit Helion and was very impressed. The things they&#x27;re building are extraordinary. And yet they have a very pragmatic, engineering-focused approach. If you&#x27;re an electrical engineer, this has to the coolest gig in the world.","commentary":"I don\u2019t know shit about nuclear fusion.<br><br>But I do know that Sam Altman put $170m of his own money (his biggest investment ever) - and Paul Graham says it\u2019s heaven for engineers.<br><br>Shut up and take my money!","url":"https://twitter.com/paulg/status/1696384287766180014","author":"paulg"},{"text":"OnlyFans owner reportedly earned $1.3 million per day in bonuses last year ($338M total) twitter.com/i/web/status/1\u2026","commentary":"The owner of onlyfans is making a cool $1.3M a day of profit.<br><br>He took $500m+ of dividends out the last two years\u2026and this is for a company he bought 5 years ago.<br><br>One of the greatest acquisitions ever","url":"https://twitter.com/Dexerto/status/1696208452895334753","author":"Dexerto"},{"text":"You weren\u2019t born to just pay bills and die","commentary":"Word","url":"https://twitter.com/AintGottaDollar/status/1690571390200721408","author":"AintGottaDollar"},{"text":"I cannot believe Bob Barker lived as close to 100 as possible without going over.","commentary":"\ud83e\udd23\ud83e\udd23\ud83e\udd23","url":"https://twitter.com/louisvirtel/status/1695479105838514520","author":"louisvirtel"}],"num":34},{"title":"5 Tweet Tuesday - August 22, 2023","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-august-22-2023","date":"2023-08-22","tweets":[{"text":"My ability to give advice: A+ My ability to take my advice: D+","commentary":"I call this \u201cthe gap.\u201d That\u2019s the space between: Intelligence = knowing what to do Wisdom = doing what you know","url":"https://twitter.com/businessbarista/status/1693620131719479663","author":"businessbarista"},{"text":"There are some ideas that are graveyards for founders - Marketplace for homemade food - App for event discovery - Social network around interests - App to aggregate medical records - Booking site for medical tourism - Personal CRM What else?","commentary":"You know how Charlie Munger once said: \u201call I want to know is where I\u2019m going to die, so I\u2019ll never go there\u201d This list is like that for startup ideas that cause business death.<br><br>I\u2019ll add one more: \u201capp that makes it easier to discover new music!\u201d","url":"https://twitter.com/erenbali/status/1693831519847293233","author":"erenbali"},{"text":"how it feels to listen to podcasts","commentary":"Speaking of\u2026I did a podcast last week with Syed Balkhi - this guy is one of the few people on earth to ever bootstrap a unicorn ($1b+ company value).<br><br>He shared a bunch of good insights, I highly recommend it","url":"https://twitter.com/zetsubouquet/status/816106962970615810","author":"zetsubouquet"},{"text":"\u201cBeing enthusiastic is worth 25 IQ points.\u201d \u2013Kevin Kelly","commentary":"I couldn\u2019t agree more","url":"https://twitter.com/awilkinson/status/1693002045178192178","author":"awilkinson"},{"text":"founder of costco: [drunk as hell] it\u2019s gonna have hot dogs and optometrists","commentary":"\ud83e\udd23\ud83e\udd23\ud83e\udd23","url":"https://twitter.com/MNateShyamalan/status/1557540266533347328","author":"MNateShyamalan"},{"text":"6. The Joe Rogan Razor My favourite content creators and artists all follow this principle: \u2022 Create what you would consume. Create things you can do for 5,853 hours -- and still find it interesting.","commentary":"Joe Rogan has spent &gt;5,000 hours podcasting.<br><br>That brings up a fun thought - instead of \u201cwhat can I do that will be successful?\u201d ask \u201cwhat can I do that I would enjoy doing for 5,000+ hours?\u201d Which tweet was gold for you?<br><br>Reply with the number (#1, #2, #3, #4, or #5)!","url":"https://twitter.com/george__mack/status/1685647478098640896","author":"george__mack"}],"num":33},{"title":"5 Tweet Tuesday - August 1, 2023","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-august-1-2023","date":"2023-08-01","tweets":[{"text":"\u201cIn order to get into the best college, you have to look smart along the way. In order to build a massive company, you have to look dumb along the way. It really is a different skill set.\u201d - @eriktorenberg on World of DaaS","commentary":"Great point by Erik.<br><br>Another version of this is: \u201cWe spend the first 18 years of our life (school) just trying to fit in with the other kids.<br><br>Then the next 18 years trying desperately to stand out as adults.\u201d","url":"https://twitter.com/auren/status/1686396618843521025","author":"auren"},{"text":"They Don&#x27;t Teach You This About Honey Bees in Schools \ud83d\udc1d: 1. Honey is the only food that has every single substance to sustain life. 2. Honey doesn&#x27;t ever turn bad. You can actually eat honey that was found in Egyptian tombs thousands of years ago. (if you dare) \u203c\ufe0f 3. A single\u2026 twitter.com/i/web/status/1\u2026","commentary":"For some reason I read this entire thread of 24 facts about bees.<br><br>It\u2019s great.<br><br>But if you don\u2019t wanna click, here\u2019s some of the best stuff: Honey never goes bad, you can even eat honey that was made thousands of years ago and it\u2019ll still taste good The darker the honey it is, the less sweet it is.<br><br>The lighter it is, the sweeter it is It was the original antibiotic, used as an antifungal medication for generations Bees don\u2019t sleep.<br><br>They work hard AND play hard","url":"https://twitter.com/TheWarKitchen/status/1686023280698814464","author":"TheWarKitchen"},{"text":"Winners expect to win.","commentary":"If you decide to play, decide to win. #3.5 \ud83d\udc8e Today\u2019s email is brought to you by Snagged So I bought a domain name... #DeliciousDomainNames twitter.com/i/web/status/1\u2026 Great domain, Rob!<br><br>I hope you make the world\u2019s best site about chicken parm.<br><br>Now back to our regularly scheduled programming\u2026we just worked with Rob to hunt down a dope domain name (you\u2019ll see soon).<br><br>If you\u2019re ever looking for a great domain broker, check out Snagged.com or just dm Rob directly on twitter","url":"https://twitter.com/heydannymiranda/status/1682451684583264277","author":"heydannymiranda"},{"text":"So I bought a domain name... #DeliciousDomainNames twitter.com/i/web/status/1\u2026","commentary":"Check it out - this guy, Sam Blond, ran revenue and sales for Brex (valued at $12b early last year).<br><br>He shares cool stories and tactics on twitter about what worked.<br><br>One of my favorites - he would send champagne to target customers when they fundraised + would track the results ( he broke down the play-by-play here ).<br><br>Incredible execution and ROI","url":"https://twitter.com/rob/status/1656742763965083653","author":"rob"},{"text":"I get a message about once / day saying the outbound champagne campaign we ran at Brex, or a variation I suggest to the founder or sales leader, is the best performing demand gen campaign the company has ever tried. A couple examples attached. Comment below with a 1 sentence\u2026 twitter.com/i/web/status/1\u2026","commentary":"I\u2019ve sent over 100 editions of 5 Tweet Tuesday and every single one has ended with a meme.<br><br>Today, we break that streak to show you this fat ass chart of Costco revenues growing beautifully, wonderfully, amazingly every year for the past 25 years.<br><br>Now, I call this the Kirkland signature email finish \ud83e\udd23\ud83e\udd23\ud83e\udd23 Which tweet was gold for you?<br><br>Reply with the number (#1, #2, #3, #4, or #5)!","url":"https://twitter.com/samdblond/status/1686001567676174336","author":"samdblond"}],"num":32},{"title":"5 Tweet Tuesday - July 18, 2023","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-july-18-2023","date":"2023-07-18","tweets":[{"text":"This original 2007 factory sealed iPhone just sold at auction for $190,372. I wonder how many Vision Pros will be purchased to keep sealed and in storage for decades - especially with its low supply. twitter.com/i/web/status/1\u2026","commentary":"$197,000, eh?<br><br>Well\u2026if you like that, I have a Threads account, lightly used, like new!","url":"https://twitter.com/rpnickson/status/1681012926943993858","author":"rpnickson"},{"text":"If there&#x27;s one thing I&#x27;ve learned in business over the last 25 years, it&#x27;s this: Every difficult decision would have been easier had I made it earlier.","commentary":"So true. \u201cNot making a decision\u201d IS a decision (and usually a bad one)","url":"https://twitter.com/jasonfried/status/1679547009076977664","author":"jasonfried"},{"text":"did I \u201ckill a plant\u201d or did the plant not have what it takes to thrive in this fast-paced environment","commentary":"\ud83e\udd23\ud83e\udd23\ud83e\udd23 Makes ya think","url":"https://twitter.com/sarahclazarus/status/1539020708 net worth is ~$25 million. My financial goal is to become a billionaire by age 50.","commentary":"First, congrats to Nick.<br><br>It\u2019s awesome to see people win But, I don\u2019t like the metric \u201cnet worth\u201d for a few reasons: It counts &quot;paper gains&quot; which are not yet realized (for most business owners 90% of net worth is tied up in their business which still has a high chance of going to zero or being cut in half) People confuse &#x27;net worth&#x27; with &#x27;self worth&#x27; Super rich people don&#x27;t know their net worth. they have so many assets it&#x27;s impossible to actually know For most people, they should just focus on...","url":"https://twitter.com/sweatystartup/status/1675920764208291844","author":"sweatystartup"},{"text":"MOANA is driving the next big tech cycle Meta OpenAI Alphabet Nvidia Apple","commentary":"For the last 10 years, FAANG has crushed almost every other investing strategy (besides \u201cbuy Bitcoin &amp; ETH\u201d).<br><br>With the AI wave it might be time for MOANA make wayyyy make wayyyy \ud83c\udfb6\u00a0\ud83c\udfb6","url":"https://twitter.com/kylebrussell/status/1675591274290708481","author":"kylebrussell"},{"text":"THE RICH AREN&#x27;T JUST &quot;LUCKY&quot; Pretend we took all the money, and re-distributed it equally. Everyone got $100,000. Within 10 years, the rich people would be rich again. wealth building is a skill that can be learned. For most people, they need to make 3 small shifts..","commentary":"I wrote a thread about money wisdom (stuff I\u2019ve learned about making money) A fun little tip: you know a thread is good when it has more bookmarks (people saving it) than likes.<br><br>This one has 3,500 bookmarks, so I think it\u2019s a hit.","url":"https://twitter.com/ShaanVP/status/1674936986518581248","author":"ShaanVP"},{"text":"AI is a tool - it replaces repetitive work, not creative work.","commentary":"Someone call the doctor, I think I disagree with a Naval tweet This last week I used AI
