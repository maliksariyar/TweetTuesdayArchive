<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Tweet Tuesday Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;--surface:#101014;--card:#15151a;--card-hover:#1a1a20;
  --border:#1e1e25;--border-light:#2a2a33;
  --t1:#ededef;--t2:#8e8e99;--t3:#4a4a55;
  --warm:#c8a461;--warm-dim:rgba(200,164,97,.07);--warm-mid:rgba(200,164,97,.15);
  --green:#5cb87a;
}
.light{
  --bg:#f5f5f0;--surface:#eaeae5;--card:#fff;--card-hover:#f8f8f5;
  --border:#ddd8d0;--border-light:#ccc7be;
  --t1:#1a1a1a;--t2:#6b6b6b;--t3:#a0a0a0;
  --warm:#9a7830;--warm-dim:rgba(154,120,48,.07);--warm-mid:rgba(154,120,48,.15);
  --green:#3a9056;
}
.light .ehdr:hover{background:rgba(0,0,0,.02)}
.light .abtn,.light .ecount{background:rgba(0,0,0,.03)}
.light .edition.open{box-shadow:0 4px 24px rgba(0,0,0,.08)}
.light .tweet-embed.highlight{background:rgba(154,120,48,.06)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}

.hdr{padding:80px 0 32px;text-align:center;position:relative}
.theme-toggle{
  position:absolute;top:28px;right:0;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;
  color:var(--t2);font-size:16px;
  transition:all .15s;
}
.theme-toggle:hover{color:var(--warm);border-color:var(--warm)}
.hdr .mark{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--warm-dim);border:1px solid var(--warm-mid);border-radius:12px;font-size:22px;margin-bottom:20px}
.hdr h1{font-size:22px;font-weight:600;letter-spacing:-0.3px;margin-bottom:6px}
.hdr p{font-size:14px;color:var(--t2);font-weight:300}
.hdr .by{margin-top:10px;font-size:12px;color:var(--t3)}
.hdr .by a{color:var(--t2);text-decoration:none;transition:color .2s}
.hdr .by a:hover{color:var(--warm)}

.progress-wrap{margin-top:16px;margin-bottom:24px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.progress-label{font-size:12px;color:var(--t2)}
.progress-pct{font-family:'DM Mono',monospace;font-size:12px;color:var(--warm);font-weight:500}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--warm);border-radius:2px;transition:width .4s}

.stats{display:flex;justify-content:center;gap:48px;padding:24px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:0}
.stat-n{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--warm);text-align:center}
.stat-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;text-align:center;margin-top:3px}

.authors-section{margin-bottom:24px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.authors-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer;user-select:none}
.authors-title{font-size:12px;color:var(--t2);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.authors-toggle{font-size:11px;color:var(--t3);transition:color .15s}
.authors-grid{display:flex;flex-wrap:wrap;gap:5px;max-height:0;overflow:hidden;transition:max-height .3s}
.authors-section.open .authors-grid{max-height:400px}
.abtn{padding:4px 10px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:5px;color:var(--t3);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:all .15s;white-space:nowrap}
.abtn:hover{color:var(--t2);border-color:var(--border-light)}
.abtn.on{color:var(--warm);border-color:var(--warm);background:var(--warm-dim)}
.abtn .ac{color:var(--t3);margin-left:3px}

.pinned-section{margin-bottom:24px;border:1px solid var(--warm-mid);border-radius:10px;background:var(--warm-dim);overflow:hidden;display:none}
.pinned-section.has-pins{display:block}
.pinned-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none}
.pinned-title{font-size:12px;color:var(--warm);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.pinned-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--warm)}
.pinned-body{padding:0 12px 12px}
.pinned-section:not(.open) .pinned-body{display:none}
.pinned-tweet{background:var(--card);border-radius:8px;padding:14px 16px;margin-bottom:5px;position:relative;transition:border-color .15s;border:1px solid transparent}
.pinned-tweet:hover{border-color:var(--border)}
.pinned-tweet .ttext{font-size:13.5px;line-height:1.55}
.pinned-tweet .tmeta{margin-top:8px}
.pinned-tweet .unpin{position:absolute;top:10px;right:10px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:5px;cursor:pointer;color:var(--t3);font-size:10px;transition:all .15s}
.pinned-tweet .unpin:hover{color:#e55;border-color:#e55}

.controls{margin-bottom:24px}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--t3);pointer-events:none}
.search{width:100%;padding:11px 14px 11px 38px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-family:'Outfit',sans-serif;font-size:13px;font-weight:300;outline:none;transition:border-color .2s}
.search::placeholder{color:var(--t3)}
.search:focus{border-color:var(--warm)}
.surprise-btn{padding:0 16px;background:var(--warm-dim);border:1px solid var(--warm-mid);border-radius:8px;color:var(--warm);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.surprise-btn:hover{background:var(--warm-mid);border-color:var(--warm)}
.years{display:flex;gap:5px;flex-wrap:wrap}
.ybtn{padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--t3);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s}
.ybtn:hover{color:var(--t2);border-color:var(--border-light)}
.ybtn.on{color:var(--warm);border-color:var(--warm);background:var(--warm-dim)}

.edition{margin-bottom:3px;border-radius:10px;border:1px solid transparent;transition:all .25s}
.edition.open{border-color:var(--border);background:var(--surface);margin-bottom:10px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.edition.read-mark .edot{background:var(--green)!important;box-shadow:none!important}
.ehdr{display:flex;align-items:center;padding:14px 16px;cursor:pointer;gap:14px;border-radius:10px;transition:background .15s;user-select:none}
.ehdr:hover{background:rgba(255,255,255,.02)}
.edition.open .ehdr:hover{background:transparent}
.edot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:all .2s}
.edition.open .edot{background:var(--warm);box-shadow:0 0 8px var(--warm-mid)}
.enum{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--t3);min-width:40px;transition:color .2s}
.edition.open .enum{color:var(--warm)}
.edate{flex:1;font-size:14px;font-weight:400;color:var(--t2);transition:color .15s}
.edition.open .edate{color:var(--t1)}
.ecount{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.02)}
.echev{width:14px;height:14px;color:var(--t3);transition:transform .3s cubic-bezier(.4,0,.2,1),color .2s;flex-shrink:0}
.edition.open .echev{transform:rotate(180deg);color:var(--warm)}
.echeck{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--t3);font-size:13px;transition:all .15s;flex-shrink:0}
.echeck:hover{color:var(--t2);border-color:var(--border-light)}
.echeck.is-read{color:var(--green);border-color:var(--green);background:rgba(92,184,122,.1)}
.ebody{overflow:hidden;display:none;padding:0 16px}
.edition.open .ebody{display:block;padding:4px 16px 18px}

.tweet{background:var(--card);border-radius:8px;padding:18px 20px;margin-bottom:6px;color:inherit;transition:background .15s,border-color .2s;border:1px solid transparent;position:relative}
.tweet:hover{background:var(--card-hover);border-color:var(--border)}
.tweet-top,.tweet-bottom{display:block;text-decoration:none;color:inherit;border-radius:4px;transition:opacity .15s}
.tweet-top:hover{opacity:.85}
.tweet-bottom:hover{opacity:.85}
.tweet.highlight{border-color:var(--warm);background:rgba(200,164,97,.04)}
.tweet.highlight .tauthor{color:var(--warm)}
.ttext{font-size:14.5px;color:var(--t1);line-height:1.65;font-weight:300}
.tsep{height:1px;background:var(--border);margin:12px 0;opacity:.5}
.tcomm-tag{font-size:10px;color:var(--warm);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-style:normal}
.tcomm{font-size:13px;color:var(--t2);line-height:1.7;font-weight:300;font-style:italic}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:10px}
.tauthor{font-size:11px;color:var(--t3);font-family:'DM Mono',monospace;transition:color .15s;flex:1}
.tweet:hover .tauthor{color:var(--t2)}
.tweet-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.tweet:hover .tweet-actions{opacity:1}
.tact{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--t3);font-size:12px;transition:all .15s}
.tact:hover{color:var(--warm);border-color:var(--warm);background:var(--warm-dim)}
.tact.pinned-state{color:var(--warm);border-color:var(--warm);background:var(--warm-dim);opacity:1!important}
.tact.copied{color:var(--green);border-color:var(--green)}

.efull{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 14px;font-size:11px;color:var(--t3);text-decoration:none;border:1px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;transition:all .15s}
.efull:hover{color:var(--warm);border-color:var(--warm)}
.empty{text-align:center;padding:48px 0;color:var(--t3);font-size:13px;display:none}
.ftr{text-align:center;padding:48px 0;border-top:1px solid var(--border);margin-top:24px}
.ftr p{font-size:11px;color:var(--t3)}.ftr a{color:var(--t2);text-decoration:none}
.top{position:fixed;bottom:24px;right:24px;width:36px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:50%;color:var(--t2);font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .2s;z-index:10}
.top:hover{color:var(--warm);border-color:var(--warm)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);padding:10px 20px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--t2);font-family:'DM Mono',monospace;transition:transform .3s,opacity .3s;opacity:0;z-index:20;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:500px){.hdr{padding:48px 0 28px}.stats{gap:28px}.ehdr{padding:12px 14px;gap:10px}.ecount{display:none}.tweet{padding:16px}.tweet-actions{opacity:1}.surprise-btn span.hide-m{display:none}}
</style>
</head>
<body>

</div>

<script>
const D=[{"title":"5 Tweet Tuesday - April 14, 2026","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-april-14-2026","date":"2026-04-14","tweets":[{"text":"BROOOOOO!!!!!! You gotta move like you already got it. The universe don\u2019t bless hesitation.","commentary":"\u201cMove like you already got it, the universe don\u2019t bless hesitation&amp;quot; is 50% of the advice you\u2019ll ever need.","url":"https://twitter.com/Dearme2_/status/2043567483009847578","author":"Dearme2_"},{"text":"The Masters shop.Only open 8 days a year.Makes $10,000,000 each day it&amp;#x27;s open, or $277 per second. Average spend is thought to be around $1,000 per person. pic.twitter.com/0Gh37KMdLd","commentary":"I\u2019ve never been to the Masters because I like real sports, but I\u2019ve heard the masters gift shop is insane Apparently people shop like crazy, and when you checkout they take your address and immediately bundle it all to be shipped to your house so you don\u2019t have to carry bags around.<br><br>This is how I want all shopping to be.","url":"https://twitter.com/jamierkennedy/status/2042524233658429731","author":"jamierkennedy"},{"text":"\u201cYou are not stressed from doing too much.You are stressed from doing too little of what you care about.\u201d\u2014 Mark Manson","commentary":"Love this.<br><br>Side note: its interesting that \u201cMark Manson\u201d is a famous self help author, because his name for sure sounds like a Netflix serial killer documentary name","url":"https://twitter.com/readswithravi/status/2042188272797946279","author":"readswithravi"},{"text":"we replaced daydreaming with doomscrolling and have the audacity to wonder why things got weird","commentary":"I saw a tweet that said \u201ckeep scrolling bro, I\u2019m sure the next tweet will be life changing\u201d and immediately felt like Cersei Lannister doing the naked shame walk in Game Of Thrones.","url":"https://twitter.com/thejayalto/status/2038662169231774142","author":"thejayalto"},{"text":"Hey man, do you mind if we push this call til next week? I\u2019m thinking one or both of us might die in the upcoming nuclear holocaust, which would pretty much solve this whole problem for us","commentary":"\ud83d\ude02","url":"https://twitter.com/on_da_spectrum/status/2041575827846857041","author":"on_da_spectrum"}],"num":166},{"title":"5 Tweet Tuesday - April 7, 2026","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-april-7-2026","date":"2026-04-07","tweets":[{"text":"I love the latin phrase &amp;quot;solvitur ambulando&amp;quot; which translates to &amp;quot;it is solved by walking&amp;quot;.  I make sure to walk to 1-1.5 hours every day it sparks some of the best ideas in my head. https://t.co/A1bh8apslE","commentary":"Going for a walk is the equivalent of taking a Nintendo cartridge out, blowing on it, and suddenly it works.","url":"https://twitter.com/ankurhandos/status/2040436360532893757","author":"ankurhandos"},{"text":"This is funny.  What if you invested in the S&amp;amp;P 500 every time CNBC had a &amp;quot;Markets in Turmoil&amp;quot; special?  Well... your average return after one year would be 40%, with a 100% success rate. pic.twitter.com/e1gLo9gupZ","commentary":"Buffett would be proud. \u201cBe fearful when others are greedy, be greedy when others are fearful.\u201d P.S. - I started a new YouTube channel and the first video was niche Warren Buffett lore.<br><br>It\u2019s great if you\u2019re an investment dork like me.","url":"https://twitter.com/dividendology/status/2039074195997339680","author":"dividendology"},{"text":"&amp;quot;Golf courses in the US consume more than 30x as much water as the entire country\u2019s data center industry uses for cooling&amp;quot;@azeem @ExponentialView pic.twitter.com/1drm4NRA18","commentary":"Saving this for the inevitable moment when activists complain about AI using too much water.","url":"https://twitter.com/dailychartbook/status/2039297338116546809","author":"dailychartbook"},{"text":"the only cure to uncer xting a guy","commentary":"Ha! so true.","url":"https://twitter.com/jeremygiffon/status/1845816878721077360","author":"jeremygiffon"},{"text":"An OG told me once: They don\u2019t respect you at the bottom, they ignore you in the middle, and they hate you at the top. You\u2019ll never have everyone\u2019s approval. So it\u2019s best to just focus on what you\u2019re doing.","commentary":"Honestly I didn\u2019t even read the tweet, but this guys\u2019 profile picture goes so hard that he had to be included this week.","url":"https://twitter.com/coachreedlive/status/1847666442830790913","author":"coachreedlive"},{"text":"When I worked for Seth Godin, one of the things I learned from him was this. &quot;What has to be true for it to take half the time?&quot; was something he would ask any time we were talking about timelines. Often the answer was that nothing needed to change other than the ship date.","commentary":"I love this question.<br><br>I\u2019m incredibly aggressive with timelines.<br><br>But usually I just ask \u201c how do we do this faster? \u201d (to the annoyance of anyone I work with) This tweet gave me a better question: \u201c what has to be true for it to take half the time ?\u201d","url":"https://twitter.com/barrettabrooks/status/1847711259309068344","author":"barrettabrooks"},{"text":"pic.twitter.com/dLks5LKGqH","commentary":"\ud83d\ude02 when people ask me about our company culture I\u2019m just going to show them this.<br><br>P.S. \u2013 No advertisement today.<br><br>So feast your eyes on this glorious empty space below where the ad normally goes.<br><br>Why?<br><br>Because life isn\u2019t about money.<br><br>Life is about sending 100,000+ people your 5 favorite tweets to laugh and learn.<br><br>You don\u2019t need to include a plug about how you\u2019ve hired a life changing exec assistant overseas for just $8/hour from Somewhere.com (shit!<br><br>It\u2019s happening again!<br><br>Ignore that.) What\u2019d you...","url":"https://twitter.com/thate uthor":"Trace_Cohen"},{"text":"Waiting to give negative feedback to a team member is like eating an overcooked steak and waiting until the bill to dispute it.","commentary":"True.<br><br>The most important part of giving feedback is the time-gap between the action and the feedback.<br><br>Faster the feedback, the higher the impact, and the less residual resentment.","url":"https://twitter.com/pinpulleddrmf/status/1835796724197007758","author":"pinpulleddrmf"},{"text":"Think about something you have been trying to make progress on recently. What is a completely different line of attack for solving it or a wildly different approach you can explore?","commentary":"Great questions are just great prompts for your brain - what\u2019s a wildly different approach I could be taking right now?","url":"https://twitter.com/jamesclear/status/1835655879011479979","author":"jamesclear"},{"text":"The miracle of DoorDash is that I just pick up my phone, punch a few things into it, and within half an hour I have, at my door, a $52 salad.","commentary":"\ud83d\ude02\ud83d\ude02 What\u2019d you think of today\u2019s edition?<br><br>Hit \u2018reply\u2019 to this email and lemme hear it! 5 Tweet Tuesday There are 500,000,000 tweets per day.<br><br>Most suck.<br><br>So every week I share the 5 best tweets I saw in the past 7 days.<br><br>Home Posts Authors \u00a9 2026 Shaan Puri.<br><br>Privacy policy Terms of use Powered by beehiiv","url":"https://twitter.com/bobthesuit/status/1835359577484698001","author":"bobthesuit"}],"num":84},{"title":"my 7-course info diet","url":"https://shaan.beehiiv.com/p/7course-info-diet","date":"2024-09-13","tweets":[{"text":"- Book I\u2019m reading the Essays of Warren Buffett. I love Buffett\u2019s communication style. I find myself taking notes not on his investment advice, but his phrases &amp;amp; stories. Here\u2019s a simple example: He\u2019s talking about red flags to watch out for in CEO\u2019s he\u2019s investing in and mentions that you shouldn\u2019t overlook a few small visible accounting errors: \u201c beware - there is seldom just one cockroach in the kitchen\u201d.","commentary":"","url":"","author":"ShaanVP"},{"text":"- Tactical advice \u201cIf you write a problem down clearly, and specifically, you have already solved half of it\u201d Kidlin\u2019s Law","commentary":"","url":"","author":"ShaanVP"},{"text":"- YouTube Video I watched this quick youtube video tutorial on Tim Ferriss\u2019 kettlebell workout. I needed a workout I could do quick (&amp;lt; 15 mins) with low/no equipment. This is an easy one. Watch here","commentary":"","url":"","author":"ShaanVP"},{"text":"- Song Too Sweet by Hozier. This is my morning walk-out song right now. Listen here","commentary":"","url":"","author":"ShaanVP"},{"text":"- TV Show I\u2019m watching a show called Unreal on Netflix. I\u2019d give it an 8.5/10 so far. The show itself isn\u2019t great, but I find the concept fascinating. What\u2019s it about? It\u2019s basically Grey\u2019s Anatomy, but instead of doctors, they show what it\u2019s like to produce a reality TV show (like the Bachelor). The people who made the show actually were producers for the Bachelor, so it\u2019s interesting to see how the Reality TV sausage is made.","commentary":"","url":"","author":"ShaanVP"},{"text":"- Nugget of wisdom \u201cThe best relationships are the ones that take the least effort.\u201d \u201cYou make the other person happy being yourself. They make you happy by being themselves, everyone is honest, and no one is putting on an act that they can\u2019t carry on for the next decade.\u201d Naval I love this idea. It\u2019s the best explanation I\u2019ve heard for how you should pick friends and who to marry. Do they make you happy just by being themself? Do you make them happy just by being yourself?","commentary":"","url":"","author":"ShaanVP"},{"text":"- TikTok Ok here\u2019s a tear jerker for the parents out there. My kids just started school for the first time. This dad posted a TikTok of him talking to his daughter before the first day of school from kindergarten all the way to college. It\u2019s an awesome video (that\u2019s why it has 36M views) @raypetelin I&amp;#x27;m so proud of this young woman. #girldad #senioryear #dad That\u2019s a wrap for today\u2019s Good Friday. Now do me a small favor\u2026 tell me what you think! I wrote it. You read it. How was it? P.S. - we\u2019re...","commentary":"","url":"","author":"ShaanVP"}],"num":83},{"title":"5 Tweet Tuesday - September 10, 2024","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-september-10-2024","date":"2024-09-10","tweets":[{"text":"Request for product: A wearable that always says I&#x27;m rested. And smart. And beautiful.","commentary":"Honestly, this is the only wearable worth buying.","url":"https://twitter.com/rrhoover/status/1833508116819820810","author":"rrhoover"},{"text":"Saw some dude wearing a Nvidia hoodie at a party in SF. Honestly, sick flex. Better way to say &quot;I&#x27;m rich&quot; than wearing a AP or whatever. All the girls were talking to him","commentary":"It\u2019s true - Nvidia hoodie is the new Rolex. (76% of Nvidia employees are millionaires, with 1 out of 3 having a net worth over $20M)","url":"https://twitter.com/samuel_spitz/status/1833332640260493686","author":"samuel_spitz"},{"text":"If you add the enterprise value of the top 8 outcomes in education, it barely amounts to the enterprise value of OnlyFans. Insane. \ud83e\udd2f","commentary":"WTF.<br><br>OnlyFans is worth more than the top 8 education companies in the world\u2026 Some other quick stats for you ( s/o Matthew Ball ): In 5 years, OnlyFans has generated ~$20B in revenue ($6.6B last year alone) OnlyFans creators received more in total payouts than every NBA player combined during the entire 2023 season ($5.3B for OnlyFans creators vs $4.9B for NBA players) OnlyFans now generates ~2x more revenue than Aylo (formerly MindGeek) - the owner of PornHub, Brazzers, RedTube, and other porn..
