<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5 Tweet Tuesday Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;--surface:#101014;--card:#15151a;--card-hover:#1a1a20;
  --border:#1e1e25;--border-light:#2a2a33;
  --t1:#ededef;--t2:#8e8e99;--t3:#4a4a55;
  --warm:#c8a461;--warm-dim:rgba(200,164,97,.07);--warm-mid:rgba(200,164,97,.15);
  --green:#5cb87a;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}

.hdr{padding:80px 0 32px;text-align:center}
.hdr .mark{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--warm-dim);border:1px solid var(--warm-mid);border-radius:12px;font-size:22px;margin-bottom:20px}
.hdr h1{font-size:22px;font-weight:600;letter-spacing:-0.3px;margin-bottom:6px}
.hdr p{font-size:14px;color:var(--t2);font-weight:300}
.hdr .by{margin-top:10px;font-size:12px;color:var(--t3)}
.hdr .by a{color:var(--t2);text-decoration:none;transition:color .2s}
.hdr .by a:hover{color:var(--warm)}

.progress-wrap{margin-top:16px;margin-bottom:24px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.progress-label{font-size:12px;color:var(--t2)}
.progress-pct{font-family:'DM Mono',monospace;font-size:12px;color:var(--warm);font-weight:500}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--warm);border-radius:2px;transition:width .4s}

.stats{display:flex;justify-content:center;gap:48px;padding:24px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:0}
.stat-n{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--warm);text-align:center}
.stat-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;text-align:center;margin-top:3px}

.authors-section{margin-bottom:24px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.authors-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer;user-select:none}
.authors-title{font-size:12px;color:var(--t2);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.authors-toggle{font-size:11px;color:var(--t3);transition:color .15s}
.authors-grid{display:flex;flex-wrap:wrap;gap:5px;max-height:0;overflow:hidden;transition:max-height .3s}
.authors-section.open .authors-grid{max-height:400px}
.abtn{padding:4px 10px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:5px;color:var(--t3);font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:all .15s;white-space:nowrap}
.abtn:hover{color:var(--t2);border-color:var(--border-light)}
.abtn.on{color:var(--warm);border-color:var(--warm);background:var(--warm-dim)}
.abtn .ac{color:var(--t3);margin-left:3px}

.pinned-section{margin-bottom:24px;border:1px solid var(--warm-mid);border-radius:10px;background:var(--warm-dim);overflow:hidden;display:none}
.pinned-section.has-pins{display:block}
.pinned-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none}
.pinned-title{font-size:12px;color:var(--warm);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.pinned-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--warm)}
.pinned-body{padding:0 12px 12px}
.pinned-section:not(.open) .pinned-body{display:none}
.pinned-tweet{background:var(--card);border-radius:8px;padding:14px 16px;margin-bottom:5px;position:relative}
.pinned-tweet .ttext{font-size:13.5px;line-height:1.55}
.pinned-tweet .tmeta{margin-top:8px}
.pinned-tweet .unpin{position:absolute;top:10px;right:10px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:5px;cursor:pointer;color:var(--t3);font-size:10px;transition:all .15s}
.pinned-tweet .unpin:hover{color:#e55;border-color:#e55}

.controls{margin-bottom:24px}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--t3);pointer-events:none}
.search{width:100%;padding:11px 14px 11px 38px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--t1);font-family:'Outfit',sans-serif;font-size:13px;font-weight:300;outline:none;transition:border-color .2s}
.search::placeholder{color:var(--t3)}
.search:focus{border-color:var(--warm)}
.surprise-btn{padding:0 16px;background:var(--warm-dim);border:1px solid var(--warm-mid);border-radius:8px;color:var(--warm);font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.surprise-btn:hover{background:var(--warm-mid);border-color:var(--warm)}
.years{display:flex;gap:5px;flex-wrap:wrap}
.ybtn{padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--t3);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:all .15s}
.ybtn:hover{color:var(--t2);border-color:var(--border-light)}
.ybtn.on{color:var(--warm);border-color:var(--warm);background:var(--warm-dim)}

.edition{margin-bottom:3px;border-radius:10px;border:1px solid transparent;transition:all .25s}
.edition.open{border-color:var(--border);background:var(--surface);margin-bottom:10px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.edition.read-mark .edot{background:var(--green)!important;box-shadow:none!important}
.ehdr{display:flex;align-items:center;padding:14px 16px;cursor:pointer;gap:14px;border-radius:10px;transition:background .15s;user-select:none}
.ehdr:hover{background:rgba(255,255,255,.02)}
.edition.open .ehdr:hover{background:transparent}
.edot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:all .2s}
.edition.open .edot{background:var(--warm);box-shadow:0 0 8px var(--warm-mid)}
.enum{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--t3);min-width:40px;transition:color .2s}
.edition.open .enum{color:var(--warm)}
.edate{flex:1;font-size:14px;font-weight:400;color:var(--t2);transition:color .15s}
.edition.open .edate{color:var(--t1)}
.ecount{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);padding:3px 8px;border-radius:4px;background:rgba(255,255,255,.02)}
.echev{width:14px;height:14px;color:var(--t3);transition:transform .3s cubic-bezier(.4,0,.2,1),color .2s;flex-shrink:0}
.edition.open .echev{transform:rotate(180deg);color:var(--warm)}
.echeck{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--t3);font-size:13px;transition:all .15s;flex-shrink:0}
.echeck:hover{color:var(--t2);border-color:var(--border-light)}
.echeck.is-read{color:var(--green);border-color:var(--green);background:rgba(92,184,122,.1)}
.ebody{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);padding:0 16px}
.edition.open .ebody{max-height:5000px;padding:4px 16px 18px}

.tweet{background:var(--card);border-radius:8px;padding:18px 20px;margin-bottom:6px;text-decoration:none;display:block;color:inherit;transition:background .15s,border-color .2s;border:1px solid transparent;position:relative}
.tweet:hover{background:var(--card-hover);border-color:var(--border)}
.tweet.highlight{border-color:var(--warm);background:rgba(200,164,97,.04)}
.tweet.highlight .tauthor{color:var(--warm)}
.ttext{font-size:14.5px;color:var(--t1);line-height:1.65;font-weight:300}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:10px}
.tauthor{font-size:11px;color:var(--t3);font-family:'DM Mono',monospace;transition:color .15s;flex:1}
.tweet:hover .tauthor{color:var(--t2)}
.tweet-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.tweet:hover .tweet-actions{opacity:1}
.tact{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--t3);font-size:12px;transition:all .15s}
.tact:hover{color:var(--warm);border-color:var(--warm);background:var(--warm-dim)}
.tact.pinned-state{color:var(--warm);border-color:var(--warm);background:var(--warm-dim);opacity:1!important}
.tact.copied{color:var(--green);border-color:var(--green)}

.efull{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:7px 14px;font-size:11px;color:var(--t3);text-decoration:none;border:1px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;transition:all .15s}
.efull:hover{color:var(--warm);border-color:var(--warm)}
.empty{text-align:center;padding:48px 0;color:var(--t3);font-size:13px;display:none}
.ftr{text-align:center;padding:48px 0;border-top:1px solid var(--border);margin-top:24px}
.ftr p{font-size:11px;color:var(--t3)}.ftr a{color:var(--t2);text-decoration:none}
.top{position:fixed;bottom:24px;right:24px;width:36px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:50%;color:var(--t2);font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .2s;z-index:10}
.top:hover{color:var(--warm);border-color:var(--warm)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);padding:10px 20px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--t2);font-family:'DM Mono',monospace;transition:transform .3s,opacity .3s;opacity:0;z-index:20;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:500px){.hdr{padding:48px 0 28px}.stats{gap:28px}.ehdr{padding:12px 14px;gap:10px}.ecount{display:none}.tweet{padding:16px}.tweet-actions{opacity:1}.surprise-btn span.hide-m{display:none}}
</style>
</head>

  <div id="feed"></div>

  <div class="ftr"><p>all content belongs to <a href="https://x.com/ShaanVP" target="_blank">Shaan Puri</a></p></div>
</div>
<button class="top" id="topBtn" onclick="scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

<script>
const D=[{"title":"5 Tweet Tuesday - April 14, 2026","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-april-14-2026","date":"2026-04-14","tweets":[{"text":"\u201cMove like you already got it, the universe don\u2019t bless hesitation&quot; is 50% of the advice you\u2019ll ever need.","url":"https://twitter.com/Dearme2_/status/2043567483009847578","author":"Dearme2_"},{"text":"I\u2019ve never been to the Masters because I like real sports, but I\u2019ve heard the masters gift shop is insane Apparently people shop like crazy, and when you checkout they take your address and immediately bundle it all to be shipped to your house so you don\u2019t have to carry bags around. This is how I want all shopping to be.","url":"https://twitter.com/jamierkennedy/status/2042524233658429731","author":"jamierkennedy"},{"text":"Love this. Side note: its interesting that \u201cMark Manson\u201d is a famous self help author, because his name for sure sounds like a Netflix serial killer documentary name","url":"https://twitter.com/readswithravi/status/2042188272797946279","author":"readswithravi"},{"text":"I saw a tweet that said \u201ckeep scrolling bro, I\u2019m sure the next tweet will be life changing\u201d and immediately felt like Cersei Lannister doing the naked shame walk in Game Of Thrones.","url":"https://twitter.com/thejayalto/status/2038662169231774142","author":"thejayalto"}],"num":156},{"title":"5 Tweet Tuesday - April 7, 2026","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-april-7-2026","date":"2026-04-07","tweets":[{"text":"Going for a walk is the equivalent of taking a Nintendo cartridge out, blowing on it, and suddenly it works.","url":"https://twitter.com/ankurhandos/status/2040436360532893757","author":"ankurhandos"},{"text":"Buffett would be proud. \u201cBe fearful when others are greedy, be greedy when others are fearful.\u201d","url":"https://twitter.com/dividendology/status/2039074195997339680","author":"dividendology"},{"text":"Saving this for the inevitable moment when activists complain about AI using too much water.","url":"https://twitter.com/dailychartbook/status/2039297338116546809","author":"dailychartbook"},{"text":"This is one of the hardest lessons for me. I love to think my way out of problems. But problems are less like puzzles and more like messy drawers. You gotta start moving things to find what you\u2019re looking for. When in doubt - don\u2019t think, move. \u201cAction produces information.\u201d","url":"https://twitter.com/cormachayden_/status/2040014129268965728","author":"cormachayden_"},{"text":"Elite groomsmanship \ud83d\ude02","url":"https://twitter.com/priest_099/status/2039701902363894089","author":"priest_099"}],"num":155},{"title":"5 Tweet Tuesday - March 31, 2026","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-march-31-2026","date":"2026-03-31","tweets":[{"text":"I don\u2019t need to see the results. He\u2019s going to transcend into something superhuman. A year without screens as an adult!","url":"https://twitter.com/daviddorg/status/2036855566371532893","author":"daviddorg"},{"text":"I don\u2019t know the scientist, but I do this and it feels great. Try this.","url":"https://twitter.com/GRITCULT/status/2037313398103572580","author":"GRITCULT"},{"text":"I predict this goes mainstream with the rise of AI. Just like 8 glasses of water, 8 hours of sleep, 10,000 steps\u2026 we will have an arbitrary ~9 pages of reading a day recommendation that will go viral.","url":"https://twitter.com/rcobooth/status/2038042360609755207","author":"rcobooth"}],"num":154},{"title":"5 Tweet Tuesday - March 24, 2026","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-march-24-2026","date":"2026-03-24","tweets":[{"text":"Hold up. Have we finally found the male version of Girl Scout Cookies? Boy Scout Peptides. Stand outside the grocery store giving the wolverine stack to out of shape dads.","url":"https://twitter.com/jefftangx/status/2034451194123333989","author":"jefftangx"},{"text":"There was a fascinating study where they found people who had brain damage to the emotional center of their brain (the \u201cvmPFC\u201d ). They still had: IQ in tact Memory in tact Could still make logical explanations But\u2026 they couldn\u2019t make decisions They were paralyzed - and had deep trouble making decisions, despite their logic being in tact. Emotions drive decisions, much more so than logic.","url":"https://twitter.com/G_S_Bhogal/status/2034925441799053816","author":"G_S_Bhogal"},{"text":"My Mt. Rushmore of \u201cAmerican culture that sounds dumb, but actually rocks\u201d The hotdog eating competition A nation wide delusion, sense of superiority Fried chicken sandwiches &amp; ranch dressing Absence of tall-poppy-syndrome","url":"https://twitter.com/nazzobetweeting/status/2035065923011559554","author":"nazzobetweeting"},{"text":"As someone who just spent 4 months coaching a high school basketball team (aka trying to get teenagers to make good decisions) \u2013 this is so true. \u201cWe\u2019re rewarded in public, for what we practice in private\u201d","url":"https://twitter.com/pissGoblin/status/2034796350123254172","author":"pissGoblin"}],"num":153},{"title":"5 Tweet Tuesday - March 17, 2026","url":"https://shaan.beehiiv.com/p/5-tweet-tuesday-march-17-2026","date":"2026-03-17","tweets":[{"text":"You pay the embarrassment tax once, the regret tax for the rest of your life.","url":"https://twitter.com/colejaczko/status/2031495048903512397","author":"colejaczko"},{"text":"Best description of why I love other people\u2019s birthdays, but not my own.","url":"https://twitter.com/AbakpaJob/status/2032798734128500763","author":"AbakpaJob"},{"text":"This is a smart point. \u201cWhy not sooner\u201d feels annoying, and impatient. But not if you take it literally. \u201cWhy not sooner\u201d as in\u2026 what is limiting us from making this happen sooner (find the bottleneck) and perhaps you can eliminate it 20% of the time. Another great hack I learned working with the CEO of Twitch. const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function showToast(msg){const t=document.getElementById('toastEl');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function gLS(k,d){try{return JSON.parse(localStorage.getItem('5tt_'+k))||d}catch(e){return d}}
function sLS(k,v){try{localStorage.setItem('5tt_'+k,JSON.stringify(v))}catch(e){}}

// Pin helpers
function pinKey(t){return(t.url||'')+'|'+t.author+'|'+t.text.slice(0,40)}
function isPinned(t){return pins.some(p=>p.key===pinKey(t))}

function doPin(eidx,tidx){
  const e=D[eidx],t=e.tweets[tidx],key=pinKey(t);
  const i=pins.findIndex(p=>p.key===key);
  if(i>=0){pins.splice(i,1);showToast('unpinned')}
  else{pins.push({key,text:t.text,author:t.author,url:t.url||'',date:e.date});showToast('pinned \u2733')}
  sLS('pins',pins);renderPins();render();
}

function rmPin(key){
  pins=pins.filter(p=>p.key!==key);sLS('pins',pins);renderPins();render();showToast('unpinned');
}

function renderPins(){
  const sec=document.getElementById('pS'),body=document.getElementById('pB');
  document.getElementById('pC').textContent=pins.length;
  if(!pins.length){sec.classList.remove('has-pins','open');return}
  sec.classList.add('has-pins','open');
  body.innerHTML=pins.map((p,i)=>'<div class="pinned-tweet"><button class="unpin" data-pidx="'+i+'">&#10005;</button><div class="ttext">'+p.text+'</div><div class="tmeta"><span class="tauthor">@'+p.author+'</span><span style="font-size:10px;color:var(--t3);font-family:DM Mono,monospace">'+(p.date?fmt(p.date):'')+'</span></div></div>').join('');
}

// Progress
function markRead(n){readE[n]=true;sLS('read',readE);updProg()}
function updProg(){const r=Object.keys(readE).length,p=Math.round(r/D.length*100);document.getElementById('pPct').textContent=p+'%';document.getElementById('pFill').style.width=p+'%'}

// Surprise
function surprise(){
  activeY=null;activeA=null;query='';document.getElementById('q').value='';
  document.querySelectorAll('.ybtn').forEach(b=>b.classList.toggle('on',!b.dataset.year));
  document.querySelectorAll('.abtn').forEach(b=>b.classList.remove('on'));
  render();
  const eds=document.querySelectorAll('.edition');if(!eds.length)return;
  const r=eds[Math.floor(Math.random()*eds.length)];
  eds.forEach(e=>e.classList.remove('open'));r.classList.add('open');
  setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'center'}),100);
}

// Event delegation for actions
document.addEventListener('click',function(ev){
  const readBtn=ev.target.closest('[data-action="read"]');
  if(readBtn){ev.preventDefault();ev.stopPropagation();const n=readBtn.dataset.rn;if(readE[n]){delete readE[n];readBtn.classList.remove('is-read');readBtn.closest('.edition').classList.remove('read-mark');showToast('unmarked')}else{readE[n]=true;readBtn.classList.add('is-read');readBtn.closest('.edition').classList.add('read-mark');showToast('marked as read')}sLS('read',readE);updProg();return}
  const pinBtn=ev.target.closest('[data-action="pin"]');
  if(pinBtn){ev.preventDefault();ev.stopPropagation();const tw=pinBtn.closest('.tweet'),ed=tw.closest('.edition');doPin(+ed.dataset.eidx,+tw.dataset.tidx);return}
  const unpinBtn=ev.target.closest('.unpin');
  if(unpinBtn){const i=+unpinBtn.dataset.pidx;if(pins[i])rmPin(pins[i].key);return}
});

// Render
const chevSVG='<svg class="echev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';

function render(){
  let items=idx;
  if(activeY)items=items.filter(e=>e.date&&e.date.startsWith(activeY));
  if(activeA)items=items.filter(e=>e.tweets.some(t=>t.author.toLowerCase()===activeA));
  if(query)items=items.filter(e=>e._s.includes(query));
  const feed=document.getElementById('feed'),empty=document.getElementById('empty');
  if(!items.length){feed.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  const ao=!!(query||activeA);
  feed.innerHTML=items.map(e=>{
    const ir=readE[e.num];
    return '<div class="edition'+(ao?' open':'')+(ir?' read-mark':'')+'" data-n="'+e.num+'" data-eidx="'+e._idx+'">'+
    '<div class="ehdr" onclick="togE(this)"><span class="edot"></span><span class="enum">#'+e.num+'</span><span class="edate">'+fmt(e.date)+'</span><span class="ecount">'+e.tweets.length+' tweets</span><button class="echeck'+(ir?' is-read':'')+'" data-action="read" data-rn="'+e.num+'" title="Mark as read">&#10003;</button>'+chevSVG+'</div>'+
    '<div class="ebody">'+
    e.tweets.map((t,i)=>{
      const tag=t.url?'a':'div',hr=t.url?' href="'+t.url+'" target="_blank" rel="noopener"':'',
        ip=isPinned(t),hl=activeA&&t.author.toLowerCase()===activeA;
      return '<'+tag+' class="tweet'+(hl?' highlight':'')+'"'+hr+' data-tidx="'+i+'">'+
        '<div class="ttext">'+t.text+'</div>'+
        '<div class="tmeta"><span class="tauthor">@'+t.author+'</span>'+
        '<div class="tweet-actions">'+
        '<button class="tact'+(ip?' pinned-state':'')+'" data-action="pin" title="Pin">&#9733;</button>'+
        '</div></div></'+tag+'>';
    }).join('')+
    '<a class="efull" href="'+e.url+'" target="_blank" rel="noopener">read full newsletter &#8599;</a>'+
    '</div></div>';
  }).join('');
}

function togE(h){const e=h.parentElement;e.classList.toggle('open')}

render();renderPins();updProg();
window.addEventListener('scroll',()=>{document.getElementById('topBtn').style.display=window.scrollY>600?'flex':'none'});
</script>
</body>
</html>
